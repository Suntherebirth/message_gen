<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="텍스트생성기">
<meta name="theme-color" content="#111a29">
<title>텍스트 생성기</title>
<style>
  :root {
    color-scheme: dark;
    --bg-top: #040b16;
    --bg-mid: #071326;
    --bg-bottom: #091a30;
    --glass-bg: rgba(10, 25, 49, 0.56);
    --glass-strong: rgba(10, 25, 49, 0.64);
    --glass-border: rgba(198, 221, 255, 0.22);
    --glass-shadow: 0 16px 36px rgba(0, 0, 0, 0.32);
    --navy-700: #193252;
    --navy-800: #102641;
    --navy-900: #091b32;
    --navy-600: #224267;
    --hint-muted: rgba(213, 227, 246, 0.62);
    --hint-bright: rgba(245, 250, 255, 0.9);
    --text-main: #e9f2ff;
    --surface-soft: rgba(42, 66, 101, 0.38);
    --surface-mid: rgba(49, 76, 115, 0.46);
    --surface-strong: rgba(62, 92, 136, 0.54);
    --surface-border: rgba(185, 209, 243, 0.22);
    --surface-border-strong: rgba(201, 222, 250, 0.3);
    --text-soft: rgba(218, 231, 249, 0.76);
    --sapphire-soft: rgba(15, 48, 88, 0.42);
    --sapphire-mid: rgba(19, 67, 116, 0.62);
    --sapphire-border: rgba(83, 145, 190, 0.42);
    --sapphire-text: #a8cde3;
    --ruby-soft: rgba(72, 16, 38, 0.44);
    --ruby-border: rgba(184, 82, 112, 0.42);
    --ruby-text: #e6afc0;
    --gold-deep: rgba(90, 54, 7, 0.72);
    --gold-soft: rgba(153, 102, 16, 0.54);
    --gold-border: rgba(245, 192, 66, 0.74);
    --gold-text: #f8d878;
    --gold-glow: rgba(226, 166, 61, 0.16);
    --action-panel: rgba(7, 19, 37, 0.88);
    --gold-highlight: rgba(255, 235, 165, 0.2);
    --gold-shadow: rgba(53, 32, 4, 0.3);
    --ruby-highlight: rgba(255, 210, 225, 0.16);
    --ruby-shadow: rgba(43, 8, 22, 0.3);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    height: 100%;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
    color: var(--text-main);
    min-height: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(145deg, rgba(16, 28, 45, 0.86), rgba(24, 45, 74, 0.82));
    -webkit-backdrop-filter: blur(20px) saturate(128%);
    backdrop-filter: blur(20px) saturate(128%);
    padding: 16px 20px 12px;
    border-bottom: 1px solid rgba(214, 227, 244, 0.2);
    box-shadow: 0 10px 30px rgba(9, 16, 28, 0.3);
  }

  .header-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header h1 {
    flex: 1;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    color: #f5f9ff;
    text-shadow: 0 1px 2px rgba(6, 12, 22, 0.36);
  }

  header h1:active {
    opacity: 0.65;
  }

  .header-icon-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(172, 195, 227, 0.18);
    color: #eaf3ff;
    border: 1px solid rgba(223, 235, 252, 0.22);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    font-size: 20px;
    line-height: 1;
  }

  .header-icon-btn:active {
    opacity: 0.7;
    transform: scale(0.94);
  }

  main {
    display: grid;
    grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
    padding: 16px 20px;
    max-width: 1180px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .left-panel-container,
  .right-panel-container {
    min-width: 0;
    min-height: 0;
    overscroll-behavior: contain;
  }

  .left-panel-container {
    grid-column: 1;
    grid-row: 1;
    position: sticky;
    top: 82px;
    height: calc(100vh - 98px);
    max-height: calc(100vh - 98px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }

  .right-panel-container {
    grid-column: 2;
    grid-row: 1;
    height: calc(100vh - 98px);
    max-height: calc(100vh - 98px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }

  .tag-filter-panel {
    align-self: start;
    min-width: 0;
    border-radius: 18px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(20px) saturate(116%);
    backdrop-filter: blur(20px) saturate(116%);
    padding: 12px;
  }

  .tag-filter-header {
    margin-bottom: 12px;
    padding: 10px;
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    background: var(--surface-mid);
  }

  .tag-filter-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tag-filter-categories {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 2px 4px;
    -webkit-overflow-scrolling: touch;
  }

  .tag-filter-category,
  .tag-filter-chip {
    min-height: 36px;
    border-radius: 9px;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    text-align: left;
  }

  .tag-filter-category {
    flex: 0 0 auto;
    min-height: 36px;
    border-radius: 999px;
    padding: 8px 12px;
    background: rgba(8, 20, 35, 0.86);
    color: rgba(140, 169, 204, 0.44);
    border: 1px solid rgba(110, 146, 190, 0.14);
  }

  .tag-filter-category.active {
    background: linear-gradient(150deg, #2f81b7, #18547d);
    color: #fff;
    border-color: rgba(171, 231, 255, 0.82);
    box-shadow: 0 0 8px 2px rgba(79, 190, 245, 0.62), 0 0 18px 5px rgba(30, 126, 211, 0.34);
  }

  .tag-filter-chip {
    background: rgba(14, 52, 91, 0.7);
    color: rgba(157, 214, 247, 0.62);
    border: 1px solid rgba(100, 181, 235, 0.24);
    box-shadow: 0 10px 20px rgba(18, 31, 52, 0.12);
  }

  .tag-filter-chip.selected {
    background: var(--sapphire-mid);
    color: #effaff;
    border-color: rgba(171, 231, 255, 0.82);
    box-shadow: 0 0 8px 2px rgba(79, 190, 245, 0.62), 0 0 18px 5px rgba(30, 126, 211, 0.34);
  }

  .tag-filter-all-chip {
    text-align: center;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .tag-filter-empty {
    color: var(--hint-muted);
    font-size: 14px;
    line-height: 1.45;
    padding: 8px 4px;
  }

  .tag-filter-panel .new-card-btn {
    margin: 16px 0 0;
    font-size: 15px;
    padding: 11px 12px;
  }

  .content-panel {
    min-width: 0;
  }

  @media (max-width: 760px) {
    main {
      display: block;
      padding: 16px;
      max-width: 680px;
    }

    .left-panel-container,
    .right-panel-container {
      height: auto;
      max-height: none;
      overflow: visible;
      touch-action: auto;
    }

    .left-panel-container {
      position: static;
      margin-bottom: 16px;
    }

    .tag-filter-panel {
      position: static;
    }

    .tag-filter-list {
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .tag-filter-chip {
      flex: 0 0 auto;
    }
  }

  /* 새 카드 버튼 */
  .new-card-btn {
    width: 100%;
    background: linear-gradient(145deg, #223f64, #142840);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 16px;
    box-shadow: 0 12px 26px rgba(8, 18, 31, 0.34);
    transition: opacity 0.15s, transform 0.1s;
  }

  .new-card-btn:active {
    opacity: 0.7;
    transform: scale(0.98);
  }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 모달 */
  body.modal-open {
    overflow: hidden;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
      radial-gradient(760px 460px at 50% 8%, rgba(183, 204, 236, 0.16), rgba(7, 13, 22, 0.64));
    z-index: 50;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: calc(72px + env(safe-area-inset-top)) 16px 16px;
  }

  .modal-overlay.hidden {
    display: none;
  }

  .modal {
    background: var(--glass-strong);
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    max-height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 16px 16px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 40px rgba(11, 18, 30, 0.3);
    -webkit-backdrop-filter: blur(20px) saturate(114%);
    backdrop-filter: blur(20px) saturate(114%);
    animation: modalIn 0.2s ease-out;
  }

  .modal::before,
  .card::before,
  .output-area::before,
  .tag-filter-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.01) 42%, transparent 66%);
  }

  .modal,
  .card,
  .output-area {
    position: relative;
    overflow: hidden;
  }

  @keyframes modalIn {
    from { transform: translateY(12px) scale(0.97); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal h2 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--text-main);
  }

  textarea#newText {
    width: 100%;
    min-height: 120px;
    border: 1px solid rgba(246, 251, 255, 0.36);
    border-radius: 10px;
    outline: none;
    resize: none;
    font-size: 16px; /* iOS 자동 줌 방지 */
    font-family: inherit;
    line-height: 1.45;
    background: rgba(196, 213, 235, 0.25);
    color: inherit;
    padding: 10px 12px;
  }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--hint-muted);
    margin: 14px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .field-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 14px 0 8px;
  }

  .field-heading .field-label {
    margin: 0;
  }

  .field-input {
    width: 100%;
    border: 1px solid rgba(246, 251, 255, 0.36);
    border-radius: 10px;
    outline: none;
    font-size: 16px;
    font-family: inherit;
    line-height: 1.45;
    background: rgba(196, 213, 235, 0.25);
    color: inherit;
    padding: 10px 12px;
  }

  .field-input:focus,
  textarea#newText:focus,
  .variable-prefix-dropdown:focus {
    border-color: var(--navy-700);
    box-shadow: 0 0 0 2px rgba(31, 60, 99, 0.2);
  }

  .field-input::placeholder,
  textarea#newText::placeholder {
    color: rgba(22, 40, 64, 0.46);
  }

  .schedule-input { margin-top: 0; }

  .insert-variable-btn {
    flex-shrink: 0;
    background: var(--ruby-soft);
    color: var(--ruby-text);
    border: 1px solid var(--ruby-border);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    transition: opacity 0.15s, transform 0.1s;
  }

  .insert-variable-btn:active {
    opacity: 0.7;
    transform: scale(0.97);
  }

  .variable-prefix-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .variable-prefix-dropdown {
    width: 100%;
    margin-top: 8px;
    border: 1px solid rgba(246, 251, 255, 0.36);
    border-radius: 10px;
    background: var(--surface-soft);
    border-color: var(--surface-border);
    color: inherit;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.35;
  }

  .variable-field-group {
    margin-bottom: 14px;
  }

  .variable-field-group:last-child {
    margin-bottom: 0;
  }

  .variable-step-indicator {
    font-size: 13px;
    font-weight: 600;
    color: var(--hint-muted);
    margin-bottom: 10px;
  }

  .variable-nav-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  .variable-nav-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
    border-radius: 999px;
    border: 1px solid var(--ruby-border);
    background: var(--ruby-soft);
    color: var(--ruby-text);
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }

  .variable-nav-chip.active {
    border: 2px solid #ff9db7;
    box-shadow: 0 0 0 4px rgba(190, 48, 91, 0.34), 0 0 16px 4px rgba(190, 48, 91, 0.44);
  }

  .variable-nav-chip.completed {
    border-color: rgba(255, 147, 176, 0.5);
    background: rgba(151, 43, 76, 0.5);
    color: #ffdce7;
  }

  .variable-nav-check {
    font-size: 12px;
    font-weight: 800;
    line-height: 1;
  }

  .variable-context {
    margin-bottom: 8px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--surface-border);
    background: var(--surface-soft);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-soft);
    word-break: break-word;
    white-space: pre-wrap;
  }

  .variable-context-chip {
    display: inline-block;
    vertical-align: baseline;
    margin: 0 2px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.25;
    background: var(--ruby-soft);
    border: 1px solid var(--ruby-border);
    color: var(--ruby-text);
    padding: 1px 6px;
  }

  .variable-context-chip.active {
    border: 2px solid #ff9db7;
    box-shadow: 0 0 0 4px rgba(190, 48, 91, 0.38), 0 0 18px 5px rgba(190, 48, 91, 0.56), 0 0 30px 8px rgba(96, 18, 45, 0.42);
    animation: variableChipGlow 1.2s ease-in-out infinite;
  }

  .variable-input {
    background: #000309;
    color: var(--text-main);
    border-color: rgba(130, 166, 214, 0.3);
  }

  .variable-input:focus {
    border-color: var(--ruby-border);
    box-shadow: 0 0 0 2px rgba(190, 48, 91, 0.2);
  }

  @keyframes variableChipGlow {
    0%, 100% { box-shadow: 0 0 0 4px rgba(190, 48, 91, 0.38), 0 0 18px 5px rgba(190, 48, 91, 0.56), 0 0 30px 8px rgba(96, 18, 45, 0.42); }
    50% { box-shadow: 0 0 0 6px rgba(210, 91, 121, 0.34), 0 0 26px 8px rgba(210, 91, 121, 0.7), 0 0 42px 12px rgba(132, 22, 57, 0.5); }
  }

  .tag-suggestion-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .tag-suggestion-btn {
    background: var(--sapphire-soft);
    color: var(--sapphire-text);
    border: 1px solid var(--sapphire-border);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }

  .selected-tag-list,
  .tag-category-list,
  .tag-option-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .selected-tag-list {
    margin: 6px 0 12px;
  }

  .tag-category-list,
  .tag-option-list {
    margin-top: 8px;
  }

  .selected-tag-chip,
  .tag-option-btn {
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }

  .selected-tag-chip,
  .tag-category-btn.active,
  .tag-option-btn {
    background: var(--sapphire-soft);
    color: var(--sapphire-text);
    border: 1px solid var(--sapphire-border);
  }

  .tag-category-btn {
    background: rgba(178, 196, 220, 0.3);
    color: rgba(22, 45, 72, 0.68);
    border: 1px solid rgba(238, 246, 255, 0.26);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }

  .tag-option-btn.selected {
    background: linear-gradient(145deg, #1b4c78, #102f50);
    color: #fff;
    border-color: rgba(171, 226, 255, 0.72);
  }

  .manage-section select.field-input + .field-input {
    margin-top: 8px;
  }

  .variable-type-new-group {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .variable-type-new-group .field-input {
    flex: 1;
    min-width: 0;
  }

  .variable-type-new-suffix {
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--hint-muted);
  }

  .manage-prefix-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .manage-tabs {
    display: flex;
    background: var(--surface-soft);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    padding: 3px;
    margin: 14px 0;
  }

  .manage-tab {
    flex: 1;
    min-height: 34px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 700;
  }

  .manage-tab.active {
    background: var(--surface-strong);
    color: #173a61;
    box-shadow: inset 0 0 0 1px var(--surface-border-strong), 0 6px 12px rgba(18, 35, 58, 0.12);
  }

  .manage-panel {
    min-height: 210px;
  }

  .manage-panel.scrollable {
    max-height: 40vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .manage-section {
    background: var(--surface-soft);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    padding: 12px;
  }

  .manage-section + .manage-section {
    margin-top: 12px;
  }

  .manage-section-title {
    display: block;
    color: var(--hint-muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }

  .manage-type-group {
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    overflow: hidden;
  }

  .manage-type-header,
  .manage-prefix-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
  }

  .manage-type-header {
    background: var(--surface-mid);
  }

  .manage-prefix-row {
    border-top: 1px solid var(--surface-border);
    background: var(--surface-mid);
    padding-left: 18px;
  }

  #variableManageList .manage-prefix-row {
    background: var(--ruby-soft);
    border-color: var(--ruby-border);
  }

  #tagManageList .manage-prefix-row {
    background: var(--sapphire-soft);
    border-color: var(--sapphire-border);
  }

  .manage-prefix-name {
    min-width: 0;
    font-size: 15px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .manage-prefix-name.subtle {
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 600;
  }

  .manage-empty-prefixes {
    color: var(--hint-muted);
    font-size: 14px;
    padding: 10px 12px 12px 18px;
  }

  .manage-empty-state {
    color: var(--hint-muted);
    font-size: 15px;
    line-height: 1.45;
    padding: 30px 16px;
    text-align: center;
  }

  .manage-prefix-remove {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(214, 228, 246, 0.56);
    color: #163a62;
    border: 1px solid var(--surface-border-strong);
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
  }

  .modal-btn {
    font-size: 16px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 10px;
    transition: opacity 0.15s, transform 0.1s;

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'textGenerator.items.v1';
  var VARIABLE_PREFIX_STORAGE_KEY = 'textGenerator.variablePrefixes.v1';
  var VARIABLE_TYPE_STORAGE_KEY = 'textGenerator.variableTypes.v1';
  var TAG_STORAGE_KEY = 'textGenerator.tags.v1';
  var LAYOUT_STORAGE_KEY = 'textGenerator.layout.v1';
  var NEW_TAG_CATEGORY_VALUE = '__new__';
  var NEW_VARIABLE_TYPE_VALUE = '__new_type__';

  var appTitleEl = document.getElementById('appTitle');
  var modalTitleEl = document.getElementById('modalTitle');
  var newTitleEl = document.getElementById('newTitle');
  var newTextEl = document.getElementById('newText');
  var newTagsEl = document.getElementById('newTags');
  var variablePrefixListEl = document.getElementById('variablePrefixList');
  var selectedTagListEl = document.getElementById('selectedTagList');
  var tagCategoryListEl = document.getElementById('tagCategoryList');
  var tagOptionListEl = document.getElementById('tagOptionList');
  var scheduledMessageEl = document.getElementById('scheduledMessage');
  var saveBtn = document.getElementById('saveBtn');
  var newCardBtn = document.getElementById('newCardBtn');
  var modalOverlay = document.getElementById('modalOverlay');
  var cancelBtn = document.getElementById('cancelBtn');
  var variableOverlay = document.getElementById('variableOverlay');
  var variableFieldsEl = document.getElementById('variableFields');
  var variableStepIndicatorEl = document.getElementById('variableStepIndicator');
  var variableNavListEl = document.getElementById('variableNavList');
  var cancelVariableBtn = document.getElementById('cancelVariableBtn');
  var prevVariableBtn = document.getElementById('prevVariableBtn');
  var generateBtn = document.getElementById('generateBtn');
  var variableManageOverlay = document.getElementById('variableManageOverlay');
  var variableTypeTabsEl = document.getElementById('variableTypeTabs');
  var variableManageListEl = document.getElementById('variableManageList');
  var variableTypeSelectEl = document.getElementById('variableTypeSelect');
  var variableTypeNewInputEl = document.getElementById('variableTypeNewInput');
  var variableTypeNewGroupEl = document.getElementById('variableTypeNewGroup');
  var variablePrefixLabelEl = document.getElementById('variablePrefixLabel');
  var closeVariableManageBtn = document.getElementById('closeVariableManageBtn');
  var addVariablePrefixBtn = document.getElementById('addVariablePrefixBtn');
  var tagManageBtn = document.getElementById('tagManageBtn');
  var tagManageOverlay = document.getElementById('tagManageOverlay');
  var tagCategoryTabsEl = document.getElementById('tagCategoryTabs');
  var tagManageListEl = document.getElementById('tagManageList');
  var tagCategorySelectEl = document.getElementById('tagCategorySelect');
  var tagCategoryNewInputEl = document.getElementById('tagCategoryNewInput');
  var tagLabelEl = document.getElementById('tagLabel');
  var addTagBtn = document.getElementById('addTagBtn');
  var closeTagManageBtn = document.getElementById('closeTagManageBtn');
  var settingsDrawerOverlay = document.getElementById('settingsDrawerOverlay');
  var settingsDrawerCloseBtn = document.getElementById('settingsDrawerCloseBtn');
  var settingsOpenCustomSortBtn = document.getElementById('settingsOpenCustomSortBtn');
  var settingsOpenVariableManageBtn = document.getElementById('settingsOpenVariableManageBtn');
  var settingsOpenTagManageBtn = document.getElementById('settingsOpenTagManageBtn');
  var settingsMenuSection = document.getElementById('settingsMenuSection');
  var customSortSection = document.getElementById('customSortSection');
  var customSortBackBtn = document.getElementById('customSortBackBtn');
  var addDividerBtn = document.getElementById('addDividerBtn');
  var resetLayoutBtn = document.getElementById('resetLayoutBtn');
  var customSortSummaryEl = document.getElementById('customSortSummary');
  var customSortListEl = document.getElementById('customSortList');
  var tagFilterCategoriesEl = document.getElementById('tagFilterCategories');
  var tagFilterListEl = document.getElementById('tagFilterList');
  var cardListEl = document.getElementById('cardList');
  var outputArea = document.getElementById('outputArea');
  var outputText = document.getElementById('outputText');
  var outputCopyBtn = document.getElementById('outputCopyBtn');
  var toastEl = document.getElementById('toast');

  var VARIABLE_TYPES = loadVariableTypes();

  var VARIABLE_PREFIXES = loadVariablePrefixes();

  var SAVED_TAGS = loadSavedTags();

  var customLayoutsByTag = loadCustomLayouts();

  var items = loadItems();
  var activeVariableItem = null;
  var variableStepGroups = [];
  var currentVariableStep = 0;
  var editingItem = null;
  var toastTimer = null;
  var openSwipeWrapper = null;
  var activeTagCategory = null;
  var activeTagFilterCategory = null;
  var activeTagFilter = null;
  var activeTagManageCategory = null;
  var activeVariableManageType = null;
  var SWIPE_ACTIONS_WIDTH = 148;

  /* ---------- 저장소 ---------- */

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.map(normalizeItem) : [];
    } catch (e) {
      return [];
    }
  }

  function normalizeItem(item) {
    item = item && typeof item === 'object' ? item : {};
    var text = typeof item.text === 'string' ? item.text : '';
    var title = typeof item.title === 'string' && item.title.trim() ? item.title.trim() : text.split('\n')[0] || '제목 없음';
    var tags = Array.isArray(item.tags) ? item.tags.map(normalizeTag).filter(Boolean) : [];
    var variables = Array.isArray(item.variables) ? item.variables.map(normalizeVariable).filter(Boolean) : [];
    if (variables.length === 0) variables = extractVariablesFromText(text);
    var scheduledMessage = normalizeScheduledMessage(item.scheduledMessage);

    return {
      id: item.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: title,
      text: text,
      tags: tags,
      variables: variables,
      scheduledMessage: scheduledMessage,
      createdAt: item.createdAt || Date.now()
    };
  }

  function normalizeScheduledMessage(schedule) {
    if (!schedule || typeof schedule !== 'object') return null;
    var note = typeof schedule.note === 'string' ? schedule.note.trim() : '';
    if (!note && typeof schedule.message === 'string') note = schedule.message.trim();
    return note ? { note: note } : null;
  }

  function createDividerId() {
    return 'divider-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
  }

  function normalizeLayoutEntry(entry) {
    if (!entry || typeof entry !== 'object') return null;
    if (entry.type === 'divider') {
      return {
        type: 'divider',
        id: typeof entry.id === 'string' && entry.id ? entry.id : createDividerId()
      };
    }
    if (entry.type === 'item' && typeof entry.id === 'string' && entry.id) {
      return {
        type: 'item',
        id: entry.id
      };
    }
    return null;
  }

  function loadCustomLayouts() {
    try {
      var raw = localStorage.getItem(LAYOUT_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      var normalized = {};

      if (Array.isArray(parsed)) {
        normalized.__all__ = parsed.map(normalizeLayoutEntry).filter(Boolean);
        return normalized;
      }

      if (!parsed || typeof parsed !== 'object') return {};

      Object.keys(parsed).forEach(function (key) {
        var entries = parsed[key];
        if (!Array.isArray(entries)) return;
        normalized[key] = entries.map(normalizeLayoutEntry).filter(Boolean);
      });

      return normalized;
    } catch (e) {
      return {};
    }
  }

  function persistCustomLayouts() {
    try {
      localStorage.setItem(LAYOUT_STORAGE_KEY, JSON.stringify(customLayoutsByTag));
    } catch (e) {
      showToast('정렬 저장에 실패했습니다');
    }
  }

  function createLayoutKey(tag) {
    if (!tag) return '__all__';
    return 'tag:' + encodeURIComponent(tag.category) + '|' + encodeURIComponent(tag.name);
  }

  function parseLayoutKey(key) {
    if (key === '__all__') return null;
    if (typeof key !== 'string' || key.indexOf('tag:') !== 0) return null;

    var parts = key.slice(4).split('|');
    if (parts.length !== 2) return null;

    return {
      category: decodeURIComponent(parts[0] || ''),
      name: decodeURIComponent(parts[1] || '')
    };
  }

  function getCurrentLayoutKey() {
    return createLayoutKey(activeTagFilter);
  }

  function getLayoutEntries(layoutKey) {
    if (!Array.isArray(customLayoutsByTag[layoutKey])) {
      customLayoutsByTag[layoutKey] = [];
    }
    return customLayoutsByTag[layoutKey];
  }

  function setLayoutEntries(layoutKey, entries) {
    customLayoutsByTag[layoutKey] = compactLayout(entries);
  }

  function getTargetItemsForLayout(layoutKey) {
    var tag = parseLayoutKey(layoutKey);
    if (!tag) return items.slice();
    return items.filter(function (item) {
      return tagIsSelected(tag, item.tags);
    });
  }

  function compactLayout(entries) {
    var result = [];
    var divider;

    entries.forEach(function (entry) {
      if (entry.type === 'divider') {
        divider = {
          type: 'divider',
          id: typeof entry.id === 'string' && entry.id ? entry.id : createDividerId()
        };
        if (result.length > 0 && result[result.length - 1].type === 'divider') {
          result[result.length - 1] = divider;
        } else {
          result.push(divider);
        }
        return;
      }
      result.push(entry);
    });

    return result;
  }

  function syncLayoutWithItems(layoutKey) {
    var itemById = {};
    var seenItemIds = {};
    var missing = [];
    var normalized = [];
    var targetItems = getTargetItemsForLayout(layoutKey);
    var layoutEntries = getLayoutEntries(layoutKey);

    targetItems.forEach(function (item) {
      itemById[item.id] = true;
    });

    layoutEntries.forEach(function (entry) {
      if (entry.type === 'divider') {
        normalized.push(entry);
        return;
      }
      if (itemById[entry.id] && !seenItemIds[entry.id]) {
        normalized.push(entry);
        seenItemIds[entry.id] = true;
      }
    });

    targetItems.forEach(function (item) {
      if (!seenItemIds[item.id]) {
        missing.push({ type: 'item', id: item.id });
      }
    });

    setLayoutEntries(layoutKey, missing.concat(normalized));
    persistCustomLayouts();
  }

  function resetCustomLayout() {
    var layoutKey = getCurrentLayoutKey();
    var targetItems = getTargetItemsForLayout(layoutKey);

    setLayoutEntries(layoutKey, targetItems.map(function (item) {
      return { type: 'item', id: item.id };
    }));
    persistCustomLayouts();
  }

  function moveCustomLayoutEntry(index, offset) {
    var layoutKey = getCurrentLayoutKey();
    var layoutEntries = getLayoutEntries(layoutKey).slice();
    var target = index + offset;
    var temp;
    if (target < 0 || target >= layoutEntries.length) return;
    temp = layoutEntries[index];
    layoutEntries[index] = layoutEntries[target];
    layoutEntries[target] = temp;
    setLayoutEntries(layoutKey, layoutEntries);
    persistCustomLayouts();
    renderCustomSortList();
    renderCards();
  }

  function addDividerToLayout() {
    var layoutKey = getCurrentLayoutKey();
    var targetItems = getTargetItemsForLayout(layoutKey);
    var layoutEntries = getLayoutEntries(layoutKey).slice();
    var insertIndex = layoutEntries.length;
    var lastItemIndex = -1;
    var i = 0;

    if (targetItems.length < 1) {
      showToast('카드가 있어야 구분선을 추가할 수 있습니다');
      return;
    }

    // 기본은 마지막 카드 앞에 넣어 마지막 카드를 단독 배치하기 쉽게 만든다.
    for (i = layoutEntries.length - 1; i >= 0; i -= 1) {
      if (layoutEntries[i].type === 'item') {
        lastItemIndex = i;
        break;
      }
    }
    if (lastItemIndex !== -1) insertIndex = lastItemIndex;

    layoutEntries.splice(insertIndex, 0, { type: 'divider', id: createDividerId() });
    setLayoutEntries(layoutKey, layoutEntries);
    persistCustomLayouts();
    renderCustomSortList();
    renderCards();
  }

  function removeDividerFromLayout(index) {
    var layoutKey = getCurrentLayoutKey();
    var layoutEntries = getLayoutEntries(layoutKey).slice();

    if (!layoutEntries[index] || layoutEntries[index].type !== 'divider') return;
    layoutEntries.splice(index, 1);
    setLayoutEntries(layoutKey, layoutEntries);
    persistCustomLayouts();
    renderCustomSortList();
    renderCards();
  }

  function getCurrentSortScopeLabel() {
    if (!activeTagFilter) return '전체보기';
    return activeTagFilter.category + ' / ' + activeTagFilter.name;
  }

  function renderCustomSortList() {
    var layoutKey = getCurrentLayoutKey();
    var layoutEntries = getLayoutEntries(layoutKey);
    var itemMap = {};

    customSortListEl.innerHTML = '';
    customSortSummaryEl.textContent = '현재 정렬 대상: ' + getCurrentSortScopeLabel() + ' · 카드 순서를 바꾸고 가로 구분선을 원하는 위치로 이동하세요.';

    items.forEach(function (item) {
      itemMap[item.id] = item;
    });

    if (layoutEntries.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'custom-sort-empty';
      empty.textContent = '정렬할 카드가 없습니다.';
      customSortListEl.appendChild(empty);
      return;
    }

    layoutEntries.forEach(function (entry, index) {
      var row = document.createElement('div');
      var main = document.createElement('div');
      var titleWrap = document.createElement('div');
      var title = document.createElement('div');
      var actions = document.createElement('div');
      var upBtn = document.createElement('button');
      var downBtn = document.createElement('button');

      row.className = 'custom-sort-row' + (entry.type === 'divider' ? ' divider' : '');
      main.className = 'custom-sort-row-main';
      title.className = 'custom-sort-row-title';
      actions.className = 'custom-sort-row-actions';

      if (entry.type === 'divider') {
        title.textContent = '가로 구분선';
      } else {
        var item = itemMap[entry.id];
        var sub = document.createElement('div');
        title.textContent = item ? item.title : '(삭제된 카드)';
        sub.className = 'custom-sort-row-sub';
        sub.textContent = item ? '태그 ' + item.tags.length + '개' : '';
        titleWrap.appendChild(title);
        titleWrap.appendChild(sub);
      }

      if (entry.type === 'divider') {
        titleWrap.appendChild(title);
      }

      upBtn.className = 'custom-sort-mini-btn';
      upBtn.type = 'button';
      upBtn.textContent = '↑';
      upBtn.setAttribute('aria-label', '위로 이동');
      upBtn.disabled = index === 0;
      upBtn.addEventListener('click', function () {
        moveCustomLayoutEntry(index, -1);
      });

      downBtn.className = 'custom-sort-mini-btn';
      downBtn.type = 'button';
      downBtn.textContent = '↓';
      downBtn.setAttribute('aria-label', '아래로 이동');
      downBtn.disabled = index === layoutEntries.length - 1;
      downBtn.addEventListener('click', function () {
        moveCustomLayoutEntry(index, 1);
      });

      actions.appendChild(upBtn);
      actions.appendChild(downBtn);

      if (entry.type === 'divider') {
        var removeBtn = document.createElement('button');
        removeBtn.className = 'custom-sort-mini-btn';
        removeBtn.type = 'button';
        removeBtn.textContent = '✕';
        removeBtn.setAttribute('aria-label', '구분선 삭제');
        removeBtn.addEventListener('click', function () {
          removeDividerFromLayout(index);
        });
        actions.appendChild(removeBtn);
      }

      main.appendChild(titleWrap);
      main.appendChild(actions);
      row.appendChild(main);
      customSortListEl.appendChild(row);
    });
  }

  function openSettingsDrawer() {
    settingsMenuSection.classList.remove('hidden');
    customSortSection.classList.add('hidden');
    settingsDrawerOverlay.classList.remove('hidden');
    document.body.classList.add('modal-open');
  }

  function closeSettingsDrawer() {
    settingsDrawerOverlay.classList.add('hidden');
    settingsMenuSection.classList.remove('hidden');
    customSortSection.classList.add('hidden');
    document.body.classList.remove('modal-open');
  }

  function openCustomSortSection() {
    settingsMenuSection.classList.add('hidden');
    customSortSection.classList.remove('hidden');
    syncLayoutWithItems(getCurrentLayoutKey());
    renderCustomSortList();
  }

  function showMainSettingsMenu() {
    customSortSection.classList.add('hidden');
    settingsMenuSection.classList.remove('hidden');
  }

  function normalizeTag(tag) {
    if (!tag || typeof tag !== 'object') return null;
    var category = typeof tag.category === 'string' ? tag.category.trim() : '';
    var name = typeof tag.name === 'string' ? tag.name.trim() : '';
    if (!category || !name) return null;
    return { category: category, name: name };
  }

  function loadSavedTags() {
    try {
      var raw = localStorage.getItem(TAG_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.map(normalizeTag).filter(Boolean) : [];
    } catch (e) {
      return [];
    }
  }

  function persistSavedTags() {
    try {
      localStorage.setItem(TAG_STORAGE_KEY, JSON.stringify(SAVED_TAGS));
    } catch (e) {
      showToast('태그 저장에 실패했습니다');
    }
  }

  function normalizeVariable(variable) {
    var name = '';
    var type = '';
    if (typeof variable === 'string') {
      name = variable.trim();
    } else if (variable && typeof variable === 'object' && typeof variable.name === 'string') {
      name = variable.name.trim();
      if (getVariableType(variable.type)) {
        type = variable.type;
      } else if (getVariableType(variable.prefixId)) {
        type = variable.prefixId;
      }
    }
    if (!name) return null;
    if (!type) type = inferVariableType(name);
    return { name: name, type: type };
  }

  function persistItems() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (e) {
      showToast('저장에 실패했습니다');
    }
  }

  function loadVariableTypes() {
    try {
      var raw = localStorage.getItem(VARIABLE_TYPE_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.map(normalizeVariableType).filter(Boolean) : [];
    } catch (e) {
      return [];
    }
  }

  function persistVariableTypes() {
    try {
      localStorage.setItem(VARIABLE_TYPE_STORAGE_KEY, JSON.stringify(VARIABLE_TYPES));
    } catch (e) {
      showToast('변수 종류 저장에 실패했습니다');
    }
  }

  function normalizeVariableType(type) {
    if (!type || typeof type !== 'object') return null;
    var label = typeof type.label === 'string' ? type.label.trim() : '';
    var baseName = typeof type.baseName === 'string' && type.baseName.trim() ? type.baseName.trim() : label.replace(/\s*변수$/, '').trim();

    if (!label || !baseName) return null;
    if (label.indexOf('변수') === -1) label += ' 변수';

    return {
      id: typeof type.id === 'string' && type.id ? type.id : createVariableTypeId(baseName),
      label: label,
      baseName: baseName
    };
  }

  function loadVariablePrefixes() {
    var prefixes = [];

    try {
      var raw = localStorage.getItem(VARIABLE_PREFIX_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      prefixes = Array.isArray(parsed) ? parsed.map(normalizeVariablePrefix).filter(Boolean) : [];
    } catch (e) {
      prefixes = [];
    }

    return prefixes;
  }

  function persistVariablePrefixes() {
    try {
      localStorage.setItem(VARIABLE_PREFIX_STORAGE_KEY, JSON.stringify(VARIABLE_PREFIXES));
    } catch (e) {
      showToast('변수 프리픽스 저장에 실패했습니다');
    }
  }

  function normalizeVariablePrefix(prefix) {
    if (!prefix || typeof prefix !== 'object') return null;
    var label = typeof prefix.label === 'string' ? prefix.label.trim() : '';
    var type = getVariableType(prefix.type) ? prefix.type : getVariableType(prefix.typeId) ? prefix.typeId : '';

    if (!label || !type) return null;

    return {
      id: typeof prefix.id === 'string' && prefix.id ? prefix.id : createVariablePrefixId(label),
      label: label,
      type: type
    };
  }

  /* ---------- 클립보드 ---------- */

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length); // iOS Safari 대응
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  /* ---------- UI ---------- */

  function parseTags(value) {
    return value.split(',').map(function (part) {
      part = part.trim();
      if (!part) return null;
      var pieces = part.split(':');
      if (pieces.length < 2) return null;
      return normalizeTag({
        category: pieces.shift(),
        name: pieces.join(':')
      });
    }).filter(Boolean);
  }

  function extractVariablesFromText(text) {
    var variables = [];
    var pattern = /\[([^\[\]\n]+)\]/g;
    var match;

    while ((match = pattern.exec(text)) !== null) {
      var name = match[1].trim();
      if (name && !findVariableByName(variables, name)) {
        variables.push({ name: name, type: inferVariableType(name) });
      }
    }

    return variables.map(normalizeVariable).filter(Boolean);
  }

  function findVariableByName(variables, name) {
    for (var index = 0; index < variables.length; index += 1) {
      if (variables[index].name === name) return variables[index];
    }
    return null;
  }

  function getVariableType(typeId) {
    for (var index = 0; index < VARIABLE_TYPES.length; index += 1) {
      if (VARIABLE_TYPES[index].id === typeId) return VARIABLE_TYPES[index];
    }
    return null;
  }

  function inferVariableType(name) {
    for (var index = 0; index < VARIABLE_TYPES.length; index += 1) {
      var type = VARIABLE_TYPES[index];
      if (name === type.baseName || name.indexOf(type.baseName + ' ') === 0) {
        return type.id;
      }
    }
    return '';
  }

  function escapeRegExp(value) {
    return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function createVariablePrefixId(label) {
    return 'prefix-' + label.replace(/\s+/g, '-').toLowerCase() + '-' + Date.now().toString(36);
  }

  function createVariableTypeId(label) {
    return 'type-' + label.replace(/\s+/g, '-').toLowerCase() + '-' + Date.now().toString(36);
  }

  function findVariableTypeByBaseName(baseName) {
    for (var index = 0; index < VARIABLE_TYPES.length; index += 1) {
      if (VARIABLE_TYPES[index].baseName === baseName) return VARIABLE_TYPES[index];
    }
    return null;
  }

  function findVariablePrefixByLabel(type, label) {
    for (var index = 0; index < VARIABLE_PREFIXES.length; index += 1) {
      if (VARIABLE_PREFIXES[index].type === type && VARIABLE_PREFIXES[index].label === label) return VARIABLE_PREFIXES[index];
    }
    return null;
  }

  function getNextVariableName(text, typeId) {
    var type = getVariableType(typeId);
    if (!type) return '';
    var nextNumber = 1;
    extractVariablesFromText(text).forEach(function (variable) {
      if (variable.type !== type.id) return;
      var match = new RegExp('^' + escapeRegExp(type.baseName) + '\\s+(\\d+)$').exec(variable.name);
      if (match) {
        nextNumber = Math.max(nextNumber, parseInt(match[1], 10) + 1);
      }
    });
    return type.baseName + ' ' + nextNumber;
  }

  function insertTextAtCursor(textarea, text) {
    var start = typeof textarea.selectionStart === 'number' ? textarea.selectionStart : textarea.value.length;
    var end = typeof textarea.selectionEnd === 'number' ? textarea.selectionEnd : textarea.value.length;

    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    textarea.focus();
    textarea.setSelectionRange(start + text.length, start + text.length);
  }

  function renderVariableContextHint(container, text, variableName) {
    var token = '[' + variableName + ']';
    var index = text.indexOf(token);
    var beforeStart = 0;
    var afterEnd = 0;
    var contextText = '';
    var pattern = /\[([^\[\]\n]+)\]/g;
    var lastIndex = 0;
    var match;
    var BEFORE_LENGTH = 80;
    var AFTER_LENGTH = 120;

    container.innerHTML = '';

    if (index === -1) {
      container.textContent = '예시 문맥을 찾지 못했습니다. 문맥에 맞는 값을 입력해 주세요.';
      return;
    }

    beforeStart = Math.max(0, index - BEFORE_LENGTH);
    afterEnd = Math.min(text.length, index + token.length + AFTER_LENGTH);
    contextText = text.slice(beforeStart, afterEnd);

    if (beforeStart > 0) contextText = '…' + contextText;
    if (afterEnd < text.length) contextText += '…';

    while ((match = pattern.exec(contextText)) !== null) {
      container.appendChild(document.createTextNode(contextText.slice(lastIndex, match.index)));

      var chip = document.createElement('span');
      chip.className = 'variable-context-chip';
      chip.classList.toggle('active', beforeStart + match.index - (beforeStart > 0 ? 1 : 0) === index);
      chip.textContent = match[0];
      container.appendChild(chip);

      lastIndex = pattern.lastIndex;
    }

    container.appendChild(document.createTextNode(contextText.slice(lastIndex)));
  }

  function renderPreviewWithChips(preview, text) {
    var pattern = /\[([^\[\]\n]+)\]/g;

      variableButton.setAttribute('aria-label', match[1].trim() + ' 변수');
      preview.appendChild(variableButton);

      lastIndex = pattern.lastIndex;
    }

    preview.appendChild(document.createTextNode(text.slice(lastIndex)));
  }

  function replaceAllText(text, search, replacement) {

  function fillTemplate(text, values) {

  function parseTimeText(value) {
    var match = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(value || '');
    var hour = 0;
    var minute = 0;
    if (!match) return null;
    hour = parseInt(match[1], 10);
    minute = parseInt(match[2], 10);
    if (hour < 0 || hour > 23 || minute < 0 || minute > 59) return null;
    return { hour: hour, minute: minute };
  }

  function formatTimeText(hour, minute) {
    var normalizedHour = ((hour % 24) + 24) % 24;
    var normalizedMinute = ((minute % 60) + 60) % 60;
    var hourText = normalizedHour < 10 ? '0' + normalizedHour : '' + normalizedHour;
    var minuteText = normalizedMinute < 10 ? '0' + normalizedMinute : '' + normalizedMinute;
    return hourText + ':' + minuteText;
  }

  function subtractMinutesFromTime(timeValue, minutesToSubtract) {
    var total = (timeValue.hour * 60) + timeValue.minute - minutesToSubtract;
    var minutesPerDay = 24 * 60;
    var normalized = ((total % minutesPerDay) + minutesPerDay) % minutesPerDay;
    var hour = Math.floor(normalized / 60);
    var minute = normalized % 60;
    return formatTimeText(hour, minute);
  }

  function applyTimeAutoFillFromSecondInput(sourceInput) {
    var sourceName = sourceInput && sourceInput.dataset ? sourceInput.dataset.variableName : '';
    var sourceType = sourceInput && sourceInput.dataset ? sourceInput.dataset.variableType : '';
    var typeInfo = getVariableType(sourceType);
    var sourceTime = parseTimeText(sourceInput ? sourceInput.value : '');
    var nameMatch = /^(.*?)(\d+)\s*$/.exec(sourceName || '');
    var sourceIndex = 0;
    var relatedInputs = variableFieldsEl.querySelectorAll('input[data-variable-name^="' + nameMatch[1] + '"]');
    var relatedByNumber = {};
    var hasThird = false;
    var targetInput = null;

    if (!typeInfo || typeInfo.baseName !== '시간' || !sourceTime || !nameMatch) return;
    sourceIndex = parseInt(nameMatch[2], 10);

    Array.prototype.forEach.call(relatedInputs, function (input) {
      var inputMatch = /^(.*?)(\d+)\s*$/.exec(input.dataset.variableName || '');
      if (!inputMatch || inputMatch[1] !== nameMatch[1]) return;
      relatedByNumber[parseInt(inputMatch[2], 10)] = input;
    });

    hasThird = !!relatedByNumber[3];

    if (sourceIndex === 3 && hasThird) {
      targetInput = relatedByNumber[2];
      if (targetInput && !targetInput.value.trim()) {
        targetInput.value = subtractMinutesFromTime(sourceTime, 20);
      }

      targetInput = relatedByNumber[1];
      if (targetInput && !targetInput.value.trim()) {
        targetInput.value = subtractMinutesFromTime(sourceTime, 40);
      }
      return;
    }

    if (sourceIndex !== 2 || hasThird) return;

    targetInput = variableFieldsEl.querySelector('input[data-variable-name="' + nameMatch[1] + '1"]');
    if (!targetInput || targetInput.value.trim()) return;

    targetInput.value = subtractMinutesFromTime(sourceTime, 30);
  }

  function applyAllTimeAutoFill() {
    Array.prototype.forEach.call(variableFieldsEl.querySelectorAll('input'), function (input) {
      applyTimeAutoFillFromSecondInput(input);
    });
  }

  function renderVariableNavigation() {
    variableNavListEl.innerHTML = '';

    variableStepGroups.forEach(function (group, index) {
      var input = group.querySelector('input');
      var name = input ? input.dataset.variableName : ('변수 ' + (index + 1));
      var isCompleted = !!(input && input.value.trim());

      var chip = document.createElement('button');
      chip.className = 'variable-nav-chip';
      chip.type = 'button';
      chip.textContent = name;
      chip.classList.toggle('active', index === currentVariableStep);
      chip.classList.toggle('completed', isCompleted);
      chip.setAttribute('aria-pressed', index === currentVariableStep ? 'true' : 'false');
      chip.setAttribute('aria-label', name + ' 입력으로 이동');
      chip.addEventListener('click', function () {
        goToVariableStep(index);
      });

      if (isCompleted) {
        var check = document.createElement('span');
        check.className = 'variable-nav-check';
        check.textContent = '✓';
        chip.appendChild(check);
      }

      variableNavListEl.appendChild(chip);
    });
  }

  function showOutput(text) {
    outputText.textContent = text;
    outputText.classList.remove('empty-output');
    outputCopyBtn.disabled = false;
    outputArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    copyToClipboard(text).then(function (ok) {
      showToast(ok ? '클립보드에 복사되었습니다' : '복사에 실패했습니다');
    });
  }

  outputCopyBtn.addEventListener('click', function () {
    if (outputCopyBtn.disabled) return;
    copyToClipboard(outputText.textContent).then(function (ok) {
      showToast(ok ? '클립보드에 다시 복사되었습니다' : '복사에 실패했습니다');
    });
  });

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 1800);
  }

  function renderCards() {
    cardListEl.innerHTML = '';

    var layoutKey = getCurrentLayoutKey();
    var layoutEntries;

    var itemMap = {};
    var orderedEntries = [];

    items.forEach(function (item) {
      itemMap[item.id] = item;
    });

    syncLayoutWithItems(layoutKey);
    layoutEntries = getLayoutEntries(layoutKey);

    layoutEntries.forEach(function (entry) {
      if (entry.type === 'divider') {
        orderedEntries.push({ type: 'divider' });
        return;
      }

      var item = itemMap[entry.id];
      var isVisible = !!item && (!activeTagFilter || tagIsSelected(activeTagFilter, item.tags));
      if (!isVisible) return;

      orderedEntries.push({ type: 'item', item: item });
    });

    if (orderedEntries.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = items.length === 0 ? '저장된 카드가 없습니다.\n"새 카드" 버튼을 눌러 추가해 보세요.' : '선택한 태그의 카드가 없습니다.';
      empty.style.whiteSpace = 'pre-line';
      cardListEl.appendChild(empty);
      return;
    }

    orderedEntries.forEach(function (entry) {
      if (entry.type === 'divider') {
        var divider = document.createElement('div');
        divider.className = 'card-divider';
        cardListEl.appendChild(divider);
        return;
      }

      var item = entry.item;
      var wrapper = document.createElement('div');
      wrapper.className = 'card-swipe';

      var actions = document.createElement('div');
      actions.className = 'card-actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'swipe-btn edit-btn';
      editBtn.type = 'button';
      editBtn.textContent = '편집';
      editBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        closeSwipeCard(wrapper);
        openModal(item);
      });

      var swipeDeleteBtn = document.createElement('button');
      swipeDeleteBtn.className = 'swipe-btn delete-btn';
      swipeDeleteBtn.type = 'button';
      swipeDeleteBtn.textContent = '삭제';
      swipeDeleteBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!window.confirm('정말 이 카드를 삭제하시겠습니까?')) return;
        items = items.filter(function (it) { return it.id !== item.id; });
        persistItems();
        syncLayoutWithItems(getCurrentLayoutKey());
        renderCustomSortList();
        renderCards();
        showToast('삭제되었습니다');
      });

      actions.appendChild(editBtn);
      actions.appendChild(swipeDeleteBtn);

      var card = document.createElement('div');
      card.className = 'card';

      var content = document.createElement('div');
      content.className = 'content';

      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = item.title;

      var titleRow = document.createElement('div');
      titleRow.className = 'title-row';

      if (item.scheduledMessage) {
        var scheduleTag = document.createElement('span');
        scheduleTag.className = 'schedule-tag';
        scheduleTag.textContent = '예약';
        scheduleTag.setAttribute('aria-label', '예약 있음');
        titleRow.appendChild(scheduleTag);
      }

      titleRow.appendChild(title);

      if (item.tags.length > 0) {
        var tags = document.createElement('div');
        tags.className = 'card-tags';
        item.tags.forEach(function (tag) {
          var tagChip = document.createElement('span');
          tagChip.className = 'card-tag';
          tagChip.textContent = formatTag(tag);
          tags.appendChild(tagChip);
        });
        titleRow.appendChild(tags);
      }

      var scheduleNote = null;
      if (item.scheduledMessage) {
        scheduleNote = document.createElement('div');
        scheduleNote.className = 'schedule-note';
        scheduleNote.textContent = item.scheduledMessage.note + '에 발송되게 예약';
        scheduleNote.setAttribute('aria-label', item.scheduledMessage.note + '에 발송되게 예약');
      }
      var preview = document.createElement('div');
      preview.className = 'preview';
      renderPreviewWithChips(preview, item.text);

      content.appendChild(titleRow);
      if (scheduleNote) content.appendChild(scheduleNote);
      content.appendChild(preview);

      // 카드 터치 → 출력 + 복사 (스와이프 중이 아닐 때만)
      card.addEventListener('click', function () {
        if (swipeMoved(wrapper)) return;
        if (wrapper.classList.contains('open')) {
          closeSwipeCard(wrapper);
          return;
        }
        if (item.variables.length > 0) {
          openVariableModal(item);
          return;
        }
        showOutput(item.text);
      });

      card.appendChild(content);
      wrapper.appendChild(actions);
      wrapper.appendChild(card);
      attachSwipeHandlers(wrapper, card);
      cardListEl.appendChild(wrapper);
    });
  }

  /* ---------- 스와이프 ---------- */

  function closeSwipeCard(wrapper) {
    if (!wrapper) return;
    var card = wrapper.querySelector('.card');
    card.style.transition = 'transform 0.2s ease-out';
    card.style.transform = 'translateX(0)';
    wrapper.classList.remove('open');
    if (openSwipeWrapper === wrapper) openSwipeWrapper = null;
  }

  function swipeMoved(wrapper) {
    return wrapper.dataset.moved === 'true';
  }

  function getTranslateX(el) {
    var transform = window.getComputedStyle(el).transform;
    if (!transform || transform === 'none') return 0;
    var match = /matrix\(([^)]+)\)/.exec(transform);
    if (!match) return 0;
    return parseFloat(match[1].split(',')[4]) || 0;
  }

  function attachSwipeHandlers(wrapper, card) {
    var startX = 0;
    var startY = 0;
    var baseX = 0;
    var dragging = false;

    card.addEventListener('pointerdown', function (e) {
      if (openSwipeWrapper && openSwipeWrapper !== wrapper) closeSwipeCard(openSwipeWrapper);
      startX = e.clientX;
      startY = e.clientY;
      baseX = wrapper.classList.contains('open') ? -SWIPE_ACTIONS_WIDTH : 0;
      dragging = true;
      wrapper.dataset.moved = 'false';
      card.style.transition = 'none';
    });

    card.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var deltaX = e.clientX - startX;
      var deltaY = e.clientY - startY;

      if (wrapper.dataset.moved !== 'true' && Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 8) {
        dragging = false;
        return;
      }
      if (Math.abs(deltaX) > 6) wrapper.dataset.moved = 'true';

      var next = Math.min(0, Math.max(-SWIPE_ACTIONS_WIDTH, baseX + deltaX));
      card.style.transform = 'translateX(' + next + 'px)';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      var current = getTranslateX(card);
      var shouldOpen = current < -SWIPE_ACTIONS_WIDTH / 2;
      card.style.transition = 'transform 0.2s ease-out';
      card.style.transform = 'translateX(' + (shouldOpen ? -SWIPE_ACTIONS_WIDTH : 0) + 'px)';
      wrapper.classList.toggle('open', shouldOpen);
      openSwipeWrapper = shouldOpen ? wrapper : (openSwipeWrapper === wrapper ? null : openSwipeWrapper);
    }

    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
  }

  /* ---------- 모달 ---------- */

  function openModal(item) {
    editingItem = item || null;
    modalTitleEl.textContent = editingItem ? '카드 편집' : '새 카드';
    modalOverlay.classList.remove('hidden');
    document.body.classList.add('modal-open');
    newTitleEl.value = editingItem ? editingItem.title : '';
    newTextEl.value = editingItem ? editingItem.text : '';
    newTagsEl.value = editingItem ? editingItem.tags.map(function (tag) {
      return tag.category + ':' + tag.name;
    }).join(', ') : '';
    var schedule = editingItem ? editingItem.scheduledMessage : null;
    scheduledMessageEl.value = schedule ? schedule.note : '';
    activeTagCategory = null;
    renderCardTagControls();
    updateSaveState();
    // 사용자 제스처 내에서 focus해야 iOS 키보드가 바로 열림
    newTitleEl.focus();
  }

  function closeModal() {
    modalOverlay.classList.add('hidden');
    document.body.classList.remove('modal-open');
    newTextEl.blur();
    editingItem = null;
  }

  function openVariableModal(item) {
    activeVariableItem = item;
    variableFieldsEl.innerHTML = '';
    variableNavListEl.innerHTML = '';
    variableStepGroups = [];
    currentVariableStep = 0;

    item.variables.forEach(function (variable, index) {
      var group = document.createElement('div');
      group.className = 'variable-field-group';

      var context = document.createElement('div');
      context.className = 'variable-context';
      renderVariableContextHint(context, item.text, variable.name);

      var input = document.createElement('input');
      input.id = 'variableInput' + index;
      input.className = 'field-input variable-input';
      input.type = 'text';
      input.dataset.variableName = variable.name;
      input.dataset.variableType = variable.type;
      input.setAttribute('aria-label', variable.name + ' 값 입력');
      input.placeholder = '문맥에 맞는 값을 입력하세요';

      input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        goToVariableStep(currentVariableStep + 1);
      });

      input.addEventListener('input', function () {
        applyTimeAutoFillFromSecondInput(input);
        renderVariableNavigation();
      });

      group.appendChild(context);
      group.appendChild(input);

      var prefixes = getVariablePrefixesByType(variable.type);
      if (prefixes.length > 0) {
        var prefixSelect = document.createElement('select');
        prefixSelect.className = 'variable-prefix-dropdown';
        prefixSelect.setAttribute('aria-label', variable.name + ' 프리픽스 선택');

        var placeholderOption = document.createElement('option');
        placeholderOption.value = '';
        placeholderOption.textContent = '프리픽스 선택';
        prefixSelect.appendChild(placeholderOption);

        prefixes.forEach(function (prefix) {
          var option = document.createElement('option');
          option.value = prefix.label;
          option.textContent = prefix.label;
          prefixSelect.appendChild(option);
        });

        prefixSelect.addEventListener('change', function () {
          if (!prefixSelect.value) return;
          input.value = prefixSelect.value;
          goToVariableStep(currentVariableStep + 1);
        });

        group.appendChild(prefixSelect);
      }

      variableFieldsEl.appendChild(group);
      variableStepGroups.push(group);
    });

    variableOverlay.classList.remove('hidden');
    document.body.classList.add('modal-open');

    goToVariableStep(0);
  }

  function goToVariableStep(index) {
    var total = variableStepGroups.length;
    if (index < 0) index = 0;
    if (index >= total) index = total - 1;
    currentVariableStep = index;

    variableStepGroups.forEach(function (group, i) {
      group.classList.toggle('hidden', i !== index);
      var chip = group.querySelector('.variable-context-chip');
      if (chip) chip.classList.toggle('active', i === index);
    });

    variableStepIndicatorEl.classList.toggle('hidden', total <= 1);
    variableStepIndicatorEl.textContent = (index + 1) + ' / ' + total;

    prevVariableBtn.classList.toggle('hidden', index === 0);
    generateBtn.textContent = index === total - 1 ? '생성' : '다음';

    renderVariableNavigation();

    var activeGroup = variableStepGroups[index];
    var activeInput = activeGroup && activeGroup.querySelector('input');
    if (activeInput) activeInput.focus();
  }

  function closeVariableModal() {
    variableOverlay.classList.add('hidden');
    document.body.classList.remove('modal-open');
    activeVariableItem = null;
    variableStepGroups = [];
    currentVariableStep = 0;
  }

  function openVariableManageModal() {
    renderVariableTypeSelect();
    variablePrefixLabelEl.value = '';
    activeVariableManageType = null;
    renderVariableManageList();
    variableManageOverlay.classList.remove('hidden');
    document.body.classList.add('modal-open');
  }

  function closeVariableManageModal() {
    variableManageOverlay.classList.add('hidden');
    document.body.classList.remove('modal-open');
  }

  function openTagManageModal() {
    renderTagCategorySelect();
    tagLabelEl.value = '';
    activeTagManageCategory = null;
    renderTagManageList();
    tagManageOverlay.classList.remove('hidden');
    document.body.classList.add('modal-open');
    tagLabelEl.focus();
  }

  function closeTagManageModal() {
    tagManageOverlay.classList.add('hidden');
    document.body.classList.remove('modal-open');
  }

  /* ---------- 이벤트 ---------- */

  newCardBtn.addEventListener('click', function () { openModal(); });

  document.addEventListener('click', function (e) {
    if (openSwipeWrapper && !openSwipeWrapper.contains(e.target)) {
      closeSwipeCard(openSwipeWrapper);
    }
  });
  cancelBtn.addEventListener('click', closeModal);
  cancelVariableBtn.addEventListener('click', closeVariableModal);
  prevVariableBtn.addEventListener('click', function () { goToVariableStep(currentVariableStep - 1); });
  closeVariableManageBtn.addEventListener('click', closeVariableManageModal);
  closeTagManageBtn.addEventListener('click', closeTagManageModal);

  tagManageBtn.addEventListener('click', openSettingsDrawer);
  settingsDrawerCloseBtn.addEventListener('click', closeSettingsDrawer);
  settingsOpenCustomSortBtn.addEventListener('click', openCustomSortSection);
  customSortBackBtn.addEventListener('click', showMainSettingsMenu);
  settingsOpenVariableManageBtn.addEventListener('click', function () {
    closeSettingsDrawer();
    openVariableManageModal();
  });
  settingsOpenTagManageBtn.addEventListener('click', function () {
    closeSettingsDrawer();
    openTagManageModal();
  });
  addDividerBtn.addEventListener('click', addDividerToLayout);
  resetLayoutBtn.addEventListener('click', function () {
    resetCustomLayout();
    renderCustomSortList();
    renderCards();
    showToast('정렬을 초기화했습니다');
  });
  variableTypeSelectEl.addEventListener('change', updateVariableTypeNewInputVisibility);

  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });

  variableOverlay.addEventListener('click', function (e) {
    if (e.target === variableOverlay) closeVariableModal();
  });

  variableManageOverlay.addEventListener('click', function (e) {
    if (e.target === variableManageOverlay) closeVariableManageModal();
  });

  tagManageOverlay.addEventListener('click', function (e) {
    if (e.target === tagManageOverlay) closeTagManageModal();
  });

  settingsDrawerOverlay.addEventListener('click', function (e) {
    if (e.target === settingsDrawerOverlay) closeSettingsDrawer();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) {
      closeModal();
    }
    if (e.key === 'Escape' && !variableOverlay.classList.contains('hidden')) {
      closeVariableModal();
    }
    if (e.key === 'Escape' && !variableManageOverlay.classList.contains('hidden')) {
      closeVariableManageModal();
    }
    if (e.key === 'Escape' && !tagManageOverlay.classList.contains('hidden')) {
      closeTagManageModal();
    }
    if (e.key === 'Escape' && !settingsDrawerOverlay.classList.contains('hidden')) {
      if (!customSortSection.classList.contains('hidden')) {
        showMainSettingsMenu();
        return;
      }
      closeSettingsDrawer();
    }
  });

  function updateSaveState() {
    saveBtn.disabled = newTitleEl.value.trim().length === 0 || newTextEl.value.trim().length === 0;
  }

  newTitleEl.addEventListener('input', updateSaveState);
  newTextEl.addEventListener('input', updateSaveState);
  scheduledMessageEl.addEventListener('input', updateSaveState);

  addVariablePrefixBtn.addEventListener('click', function () {
    var creatingNewType = variableTypeSelectEl.value === NEW_VARIABLE_TYPE_VALUE;
    var prefixLabel = variablePrefixLabelEl.value.trim();

    if (!creatingNewType && !prefixLabel) {
      showToast('프리픽스를 입력해 주세요');
      return;
    }

    var typeId = variableTypeSelectEl.value;

    if (creatingNewType) {
      var baseName = variableTypeNewInputEl.value.trim();
      if (!baseName || findVariableTypeByBaseName(baseName)) {
        showToast('종류를 확인해 주세요');
        return;
      }
      var newType = normalizeVariableType({
        id: createVariableTypeId(baseName),
        label: baseName + ' 변수',
        baseName: baseName
      });
      VARIABLE_TYPES.push(newType);
      persistVariableTypes();
      typeId = newType.id;
    }

    if (prefixLabel) {
      if (findVariablePrefixByLabel(typeId, prefixLabel)) {
        showToast('이미 등록된 프리픽스입니다');
      } else {
        VARIABLE_PREFIXES.push(normalizeVariablePrefix({
          id: createVariablePrefixId(prefixLabel),
          label: prefixLabel,
          type: typeId
        }));
        persistVariablePrefixes();
      }
    }

    renderVariablePrefixButtons();
    renderVariableTypeSelect();
    variableTypeSelectEl.value = typeId;
    updateVariableTypeNewInputVisibility();
    activeVariableManageType = typeId;
    renderVariableManageList();
    renderCards();
    variablePrefixLabelEl.value = '';
    showToast('추가되었습니다');
  });

  function getSavedTagCategories() {
    var categories = [];
    SAVED_TAGS.forEach(function (tag) {
      if (categories.indexOf(tag.category) === -1) categories.push(tag.category);
    });
    return categories;
  }

  function renderTagCategorySelect() {
    var previousValue = tagCategorySelectEl.value;
    var categories = getSavedTagCategories();
    tagCategorySelectEl.innerHTML = '';

    categories.forEach(function (category) {
      var option = document.createElement('option');
      option.value = category;
      option.textContent = category;
      tagCategorySelectEl.appendChild(option);
    });

    var newOption = document.createElement('option');
    newOption.value = NEW_TAG_CATEGORY_VALUE;
    newOption.textContent = '직접 입력 (새 분류)';
    tagCategorySelectEl.appendChild(newOption);

    tagCategorySelectEl.value = categories.indexOf(previousValue) !== -1 ? previousValue : (categories[0] || NEW_TAG_CATEGORY_VALUE);
    updateTagCategoryNewInputVisibility();
  }

  function updateTagCategoryNewInputVisibility() {
    var showNewInput = tagCategorySelectEl.value === NEW_TAG_CATEGORY_VALUE;
    tagCategoryNewInputEl.classList.toggle('hidden', !showNewInput);
    if (!showNewInput) tagCategoryNewInputEl.value = '';
  }

  tagCategorySelectEl.addEventListener('change', updateTagCategoryNewInputVisibility);

  addTagBtn.addEventListener('click', function () {
    var category = tagCategorySelectEl.value === NEW_TAG_CATEGORY_VALUE
      ? tagCategoryNewInputEl.value
      : tagCategorySelectEl.value;
    var tag = normalizeTag({
      category: category,
      name: tagLabelEl.value
    });
    if (!tag || findSavedTag(tag)) {
      showToast('태그를 확인해 주세요');
      return;
    }

    SAVED_TAGS.push(tag);
    persistSavedTags();
    renderCardTagControls();
    renderTagFilter();
    renderTagCategorySelect();
    tagCategorySelectEl.value = tag.category;
    updateTagCategoryNewInputVisibility();
    activeTagManageCategory = tag.category;
    renderTagManageList();
    tagLabelEl.value = '';
    showToast('태그가 추가되었습니다');
  });

  saveBtn.addEventListener('click', function () {
    var title = newTitleEl.value.trim();
    var text = newTextEl.value.trim();
    if (!title || !text) return;
    var scheduleNote = scheduledMessageEl.value.trim();
    var scheduledMessage = scheduleNote ? { note: scheduleNote } : null;

    var wasEditing = !!editingItem;

    if (editingItem) {
      editingItem.title = title;
      editingItem.text = text;
      editingItem.tags = parseTags(newTagsEl.value);
      editingItem.variables = extractVariablesFromText(text);
      editingItem.scheduledMessage = scheduledMessage;
    } else {
      var newItem = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: title,
        text: text,
        tags: parseTags(newTagsEl.value),
        variables: extractVariablesFromText(text),
        scheduledMessage: scheduledMessage,
        createdAt: Date.now()
      };
      items.unshift(newItem);
    }
    saveTags(editingItem ? editingItem.tags : items[0].tags);
    persistItems();
    syncLayoutWithItems(getCurrentLayoutKey());
    renderTagFilter();
    renderCards();
    renderCustomSortList();

    closeModal();
    showToast(wasEditing ? '수정되었습니다' : '저장되었습니다');
  });

  generateBtn.addEventListener('click', function () {
    if (!activeVariableItem) return;

    if (currentVariableStep < variableStepGroups.length - 1) {
      goToVariableStep(currentVariableStep + 1);
      return;
    }

    applyAllTimeAutoFill();

    var values = {};
    Array.prototype.forEach.call(variableFieldsEl.querySelectorAll('input'), function (input) {
      values[input.dataset.variableName] = input.value.trim();
    });

    showOutput(fillTemplate(activeVariableItem.text, values));
    closeVariableModal();
  });

  /* ---------- 초기화 ---------- */

  renderVariablePrefixButtons();
  renderCardTagControls();
  syncLayoutWithItems(getCurrentLayoutKey());
  activeTagFilter = getKstWeekdayTag();
  activeTagFilterCategory = activeTagFilter ? activeTagFilter.category : null;
  renderTagFilter();
  renderCards();
})();
</script>
</body>
