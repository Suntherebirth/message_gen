<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="텍스트생성기">
<meta name="theme-color" content="#111a29">
<title>텍스트 생성기</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1 id="appTitle">텍스트 생성기</h1>
      <button id="mobileTagFilterBtn" class="mobile-tag-filter-btn" type="button" aria-label="태그 필터 열기">전체보기</button>
      <button id="tagManageBtn" class="header-icon-btn" type="button" aria-label="설정 메뉴 열기">&#9881;</button>
    </div>
  </header>

  <main>
    <div class="main-workspace-group">
      <div class="left-panel-container">
        <aside class="tag-filter-panel" aria-label="태그 선택 영역">
          <div id="tagFilterCategories" class="tag-filter-categories" role="tablist" aria-label="태그 분류"></div>
          <div id="tagFilterList" class="tag-filter-list"></div>
          <button id="newCardBtn" class="new-card-btn">＋ 새 카드</button>
        </aside>
      </div>

      <div class="output-area-wrapper">
        <div id="outputArea" class="output-area">
          <div id="outputText" class="text"></div>
        </div>
        <button id="outputCopyBtn" class="output-copy-btn" type="button" disabled>다시 복사</button>
      </div>

      <div class="card-stack-wrapper">
        <div id="cardList"></div>
      </div>
    </div>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-body">
        <h2 id="modalTitle">새 카드</h2>
        <label class="field-label" for="newTitle">제목</label>
        <input id="newTitle" class="field-input" type="text" placeholder="카드 제목">
        <div class="field-heading">
          <label class="field-label" for="newText">내용</label>
        </div>
        <div id="variablePrefixList" class="variable-prefix-list"></div>
        <textarea id="newText" placeholder="저장할 텍스트를 입력하세요..."></textarea>
        <label class="field-label">태그</label>
        <input id="newTags" type="hidden">
        <div id="selectedTagList" class="selected-tag-list"></div>
        <div id="tagCategoryList" class="tag-category-list"></div>
        <div id="tagOptionList" class="tag-option-list"></div>
        <label class="field-label" for="scheduledMessage">예약</label>
        <input id="scheduledMessage" class="field-input schedule-input" type="text" placeholder="예: 토요일 11:50">
      </div>
      <div class="modal-actions">
        <button id="cancelBtn" class="modal-btn secondary">취소</button>
        <button id="saveBtn" class="modal-btn primary" disabled>저장</button>
      </div>
    </div>
  </div>

  <div id="variableOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="variableTitle">
      <div class="modal-body">
        <h2 id="variableTitle">변수 입력</h2>
        <div id="variableStepIndicator" class="variable-step-indicator hidden"></div>
        <div id="variableNavList" class="variable-nav-list"></div>
        <div id="variableFields"></div>
      </div>
      <div class="modal-actions">
        <button id="cancelVariableBtn" class="modal-btn secondary">취소</button>
        <button id="prevVariableBtn" class="modal-btn secondary hidden">이전</button>
        <button id="generateBtn" class="modal-btn primary">생성</button>
      </div>
    </div>
  </div>

  <div id="variableManageOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="variableManageTitle">
      <div class="modal-body">
        <h2 id="variableManageTitle">변수 관리</h2>
        <div class="manage-section">
          <label class="manage-section-title" for="variableTypeSelect">종류</label>
          <select id="variableTypeSelect" class="field-input" aria-label="변수 종류 선택"></select>
          <div id="variableTypeNewGroup" class="variable-type-new-group hidden">
            <input id="variableTypeNewInput" class="field-input" type="text" placeholder="예: 시간">
            <span class="variable-type-new-suffix">변수</span>
          </div>
          <label class="field-label" for="variablePrefixLabel">프리픽스</label>
          <input id="variablePrefixLabel" class="field-input" type="text" placeholder="예: 오타니">
          <div class="modal-actions">
            <button id="addVariablePrefixBtn" class="modal-btn primary">추가</button>
          </div>
        </div>
        <div id="variableTypeTabs" class="manage-tabs" role="tablist" aria-label="변수 종류"></div>
        <div id="variableManageList" class="manage-panel scrollable"></div>
      </div>
      <div class="modal-actions">
        <button id="closeVariableManageBtn" class="modal-btn secondary">닫기</button>
      </div>
    </div>
  </div>

  <div id="tagManageOverlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tagManageTitle">
      <div class="modal-body">
        <h2 id="tagManageTitle">태그 관리</h2>
        <div class="manage-section">
          <label class="manage-section-title" for="tagCategorySelect">분류</label>
          <select id="tagCategorySelect" class="field-input" aria-label="태그 분류 선택"></select>
          <input id="tagCategoryNewInput" class="field-input hidden" type="text" placeholder="새 분류 이름">
          <label class="field-label" for="tagLabel">태그</label>
          <input id="tagLabel" class="field-input" type="text" placeholder="예: 월요일">
          <div class="modal-actions">
            <button id="addTagBtn" class="modal-btn primary">태그 추가</button>
          </div>
        </div>
        <div id="tagCategoryTabs" class="manage-tabs" role="tablist" aria-label="태그 분류"></div>
        <div id="tagManageList" class="manage-panel scrollable"></div>
      </div>
      <div class="modal-actions">
        <button id="closeTagManageBtn" class="modal-btn secondary">닫기</button>
      </div>
    </div>
  </div>

  <div id="settingsDrawerOverlay" class="drawer-overlay hidden">
    <aside class="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settingsDrawerTitle">
      <div class="settings-drawer-header">
        <div id="settingsDrawerTitle" class="settings-drawer-title">설정</div>
        <button id="settingsDrawerCloseBtn" class="settings-close-btn" type="button">닫기</button>
      </div>
      <div class="settings-drawer-body">
        <section id="settingsMenuSection" class="settings-menu-list">
          <button id="settingsOpenCustomSortBtn" class="settings-menu-btn" type="button">카드 커스텀 정렬</button>
          <button id="settingsOpenVariableManageBtn" class="settings-menu-btn" type="button">변수 관리</button>
          <button id="settingsOpenTagManageBtn" class="settings-menu-btn" type="button">태그 관리</button>
          <button id="settingsExportBtn" class="settings-menu-btn settings-data-btn" type="button">ZIP으로 내보내기</button>
          <button id="settingsImportBtn" class="settings-menu-btn settings-data-btn" type="button">ZIP 불러오기</button>
          <input id="settingsImportInput" type="file" accept=".zip,application/zip" hidden>
        </section>
        <section id="customSortSection" class="custom-sort-section hidden">
          <div class="settings-drawer-header">
            <button id="customSortBackBtn" class="settings-back-btn" type="button">이전</button>
            <div class="settings-drawer-title">카드 커스텀 정렬</div>
            <div style="width:34px;"></div>
          </div>
          <div id="customSortSummary" class="custom-sort-summary">카드 순서를 바꾸고 가로 구분선을 원하는 위치로 이동하세요.</div>
          <div class="custom-sort-actions">
            <button id="addDividerBtn" class="custom-sort-action-btn" type="button">구분선 추가</button>
            <button id="resetLayoutBtn" class="custom-sort-action-btn" type="button">정렬 초기화</button>
          </div>
          <div id="customSortList" class="custom-sort-list"></div>
        </section>
      </div>
    </aside>
  </div>

  <div id="mobileTagDrawerOverlay" class="drawer-overlay mobile-tag-drawer-overlay hidden">
    <aside class="mobile-tag-drawer" role="dialog" aria-modal="true" aria-labelledby="mobileTagDrawerTitle">
      <div class="settings-drawer-header">
        <div id="mobileTagDrawerTitle" class="settings-drawer-title">태그 필터</div>
        <button id="mobileTagDrawerCloseBtn" class="settings-close-btn" type="button">닫기</button>
      </div>
      <div id="mobileTagDrawerBody" class="mobile-tag-drawer-body"></div>
    </aside>
  </div>

  <div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'textGenerator.items.v1';
  var VARIABLE_PREFIX_STORAGE_KEY = 'textGenerator.variablePrefixes.v1';
  var VARIABLE_TYPE_STORAGE_KEY = 'textGenerator.variableTypes.v1';
  var TAG_STORAGE_KEY = 'textGenerator.tags.v1';
  var LAYOUT_STORAGE_KEY = 'textGenerator.layout.v1';
  var NEW_TAG_CATEGORY_VALUE = '__new__';
  var NEW_VARIABLE_TYPE_VALUE = '__new_type__';

  var appTitleEl = document.getElementById('appTitle');
  var modalTitleEl = document.getElementById('modalTitle');
  var newTitleEl = document.getElementById('newTitle');
  var newTextEl = document.getElementById('newText');
  var newTagsEl = document.getElementById('newTags');
  var variablePrefixListEl = document.getElementById('variablePrefixList');
  var selectedTagListEl = document.getElementById('selectedTagList');
  var tagCategoryListEl = document.getElementById('tagCategoryList');
  var tagOptionListEl = document.getElementById('tagOptionList');
  var scheduledMessageEl = document.getElementById('scheduledMessage');
  var saveBtn = document.getElementById('saveBtn');
  var newCardBtn = document.getElementById('newCardBtn');
  var modalOverlay = document.getElementById('modalOverlay');
  var cancelBtn = document.getElementById('cancelBtn');
  var variableOverlay = document.getElementById('variableOverlay');
  var variableFieldsEl = document.getElementById('variableFields');
  var variableStepIndicatorEl = document.getElementById('variableStepIndicator');
  var variableNavListEl = document.getElementById('variableNavList');
  var cancelVariableBtn = document.getElementById('cancelVariableBtn');
  var prevVariableBtn = document.getElementById('prevVariableBtn');
  var generateBtn = document.getElementById('generateBtn');
  var variableManageOverlay = document.getElementById('variableManageOverlay');
  var variableTypeTabsEl = document.getElementById('variableTypeTabs');
  var variableManageListEl = document.getElementById('variableManageList');
  var variableTypeSelectEl = document.getElementById('variableTypeSelect');
  var variableTypeNewInputEl = document.getElementById('variableTypeNewInput');
  var variableTypeNewGroupEl = document.getElementById('variableTypeNewGroup');
  var variablePrefixLabelEl = document.getElementById('variablePrefixLabel');
  var closeVariableManageBtn = document.getElementById('closeVariableManageBtn');
  var addVariablePrefixBtn = document.getElementById('addVariablePrefixBtn');
  var tagManageBtn = document.getElementById('tagManageBtn');
  var mobileTagFilterBtn = document.getElementById('mobileTagFilterBtn');
  var tagManageOverlay = document.getElementById('tagManageOverlay');
  var tagCategoryTabsEl = document.getElementById('tagCategoryTabs');
  var tagManageListEl = document.getElementById('tagManageList');
  var tagCategorySelectEl = document.getElementById('tagCategorySelect');
  var tagCategoryNewInputEl = document.getElementById('tagCategoryNewInput');
  var tagLabelEl = document.getElementById('tagLabel');
  var addTagBtn = document.getElementById('addTagBtn');
  var closeTagManageBtn = document.getElementById('closeTagManageBtn');
  var settingsDrawerOverlay = document.getElementById('settingsDrawerOverlay');
  var settingsDrawerCloseBtn = document.getElementById('settingsDrawerCloseBtn');
  var settingsOpenCustomSortBtn = document.getElementById('settingsOpenCustomSortBtn');
  var settingsOpenVariableManageBtn = document.getElementById('settingsOpenVariableManageBtn');
  var settingsOpenTagManageBtn = document.getElementById('settingsOpenTagManageBtn');
  var settingsExportBtn = document.getElementById('settingsExportBtn');
  var settingsImportBtn = document.getElementById('settingsImportBtn');
  var settingsImportInput = document.getElementById('settingsImportInput');
  var settingsMenuSection = document.getElementById('settingsMenuSection');
  var customSortSection = document.getElementById('customSortSection');
  var customSortBackBtn = document.getElementById('customSortBackBtn');
  var addDividerBtn = document.getElementById('addDividerBtn');
  var resetLayoutBtn = document.getElementById('resetLayoutBtn');
  var customSortSummaryEl = document.getElementById('customSortSummary');
  var customSortListEl = document.getElementById('customSortList');
  var mobileTagDrawerOverlay = document.getElementById('mobileTagDrawerOverlay');
  var mobileTagDrawerBody = document.getElementById('mobileTagDrawerBody');
  var mobileTagDrawerCloseBtn = document.getElementById('mobileTagDrawerCloseBtn');
  var leftPanelContainer = document.querySelector('.left-panel-container');
  var mainWorkspaceGroup = document.querySelector('.main-workspace-group');
  var tagFilterCategoriesEl = document.getElementById('tagFilterCategories');
  var tagFilterListEl = document.getElementById('tagFilterList');
  var cardListEl = document.getElementById('cardList');
  var outputArea = document.getElementById('outputArea');
  var outputText = document.getElementById('outputText');
  var outputCopyBtn = document.getElementById('outputCopyBtn');
  var toastEl = document.getElementById('toast');

  var VARIABLE_TYPES = loadVariableTypes();

  var VARIABLE_PREFIXES = loadVariablePrefixes();

  var SAVED_TAGS = loadSavedTags();

  var customLayoutsByTag = loadCustomLayouts();

  var items = loadItems();
  var activeVariableItem = null;
  var variableStepGroups = [];
  var currentVariableStep = 0;
  var editingItem = null;
  var toastTimer = null;
  var openSwipeWrapper = null;
  var activeTagCategory = null;
  var activeTagFilterCategory = null;
  var activeTagFilter = null;
  var pendingTagFilterPulseKey = null;
  var activeTagManageCategory = null;
  var activeVariableManageType = null;
  var SWIPE_ACTIONS_WIDTH = 148;
  var modalScrollState = null;

  function getModalScrollTargets() {
    return [
      document.querySelector('.left-panel-container'),
      document.querySelector('.card-stack-wrapper'),
      outputText
    ].filter(function (element) { return element; });
  }

  function beginModalSession() {
    if (!modalScrollState) {
      modalScrollState = {
        windowY: window.scrollY,
        targets: getModalScrollTargets().map(function (element) {
          return { element: element, top: element.scrollTop };
        })
      };
      // iOS Safari에서는 body에 overflow:hidden만으로 배경 스크롤이 막히지 않으므로 body를 화면에 고정해 배경 스크롤을 차단한다.
      document.body.style.position = 'fixed';
      document.body.style.top = -modalScrollState.windowY + 'px';
      document.body.style.left = '0';
      document.body.style.right = '0';
    }
    document.body.classList.add('modal-open');
  }

  function endModalSession() {
    var state = modalScrollState;
    modalScrollState = null;

    if (!state) {
      document.body.classList.remove('modal-open');
      return;
    }

    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
    document.body.classList.remove('modal-open');
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';

    function restore() {
      if (modalScrollState !== null) return;
      window.scrollTo(0, state.windowY);
      state.targets.forEach(function (target) {
        target.element.scrollTop = target.top;
      });
    }

    restore();
    window.requestAnimationFrame(restore);
    window.setTimeout(restore, 300);
  }

  /* ---------- 저장소 ---------- */

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.map(normalizeItem) : [];
    } catch (e) {
      return [];
    }
  }

  function normalizeItem(item) {
    item = item && typeof item === 'object' ? item : {};
    var text = typeof item.text === 'string' ? item.text : '';
    var title = typeof item.title === 'string' && item.title.trim() ? item.title.trim() : text.split('\n')[0] || '제목 없음';
    var tags = Array.isArray(item.tags) ? item.tags.map(normalizeTag).filter(Boolean) : [];
    var variables = Array.isArray(item.variables) ? item.variables.map(normalizeVariable).filter(Boolean) : [];
    if (variables.length === 0) variables = extractVariablesFromText(text);
    var scheduledMessage = normalizeScheduledMessage(item.scheduledMessage);

    return {
      id: item.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: title,
      text: text,
      tags: tags,
      variables: variables,
      scheduledMessage: scheduledMessage,
      createdAt: item.createdAt || Date.now()
    };
  }

  function normalizeScheduledMessage(schedule) {
    if (!schedule || typeof schedule !== 'object') return null;
    var note = typeof schedule.note === 'string' ? schedule.note.trim() : '';
    if (!note && typeof schedule.message === 'string') note = schedule.message.trim();
    return note ? { note: note } : null;
  }

  function createDividerId() {
    return 'divider-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
  }

  function normalizeLayoutEntry(entry) {
    if (!entry || typeof entry !== 'object') return null;
    if (entry.type === 'divider') {
      return {
        type: 'divider',
        id: typeof entry.id === 'string' && entry.id ? entry.id : createDividerId()
      };
    }
    if (entry.type === 'item' && typeof entry.id === 'string' && entry.id) {
      return {
        type: 'item',
        id: entry.id
      };
    }
    return null;
  }

  function loadCustomLayouts() {
    try {
      var raw = localStorage.getItem(LAYOUT_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      var normalized = {};

      if (Array.isArray(parsed)) {
        normalized.__all__ = parsed.map(normalizeLayoutEntry).filter(Boolean);
        return normalized;
      }

      if (!parsed || typeof parsed !== 'object') return {};

      Object.keys(parsed).forEach(function (key) {
        var entries = parsed[key];
        if (!Array.isArray(entries)) return;
        normalized[key] = entries.map(normalizeLayoutEntry).filter(Boolean);
      });

      return normalized;
    } catch (e) {
      return {};
    }
  }

  function persistCustomLayouts() {
    try {
      localStorage.setItem(LAYOUT_STORAGE_KEY, JSON.stringify(customLayoutsByTag));
    } catch (e) {
      showToast('정렬 저장에 실패했습니다');
    }
  }

  function createLayoutKey(tag) {
    if (!tag) return '__all__';
    return 'tag:' + encodeURIComponent(tag.category) + '|' + encodeURIComponent(tag.name);
  }

  function parseLayoutKey(key) {
    if (key === '__all__') return null;
    if (typeof key !== 'string' || key.indexOf('tag:') !== 0) return null;

    var parts = key.slice(4).split('|');
    if (parts.length !== 2) return null;

    return {
      category: decodeURIComponent(parts[0] || ''),
      name: decodeURIComponent(parts[1] || '')
    };
  }

  function getCurrentLayoutKey() {
    return createLayoutKey(activeTagFilter);
  }

  function getLayoutEntries(layoutKey) {
    if (!Array.isArray(customLayoutsByTag[layoutKey])) {
      customLayoutsByTag[layoutKey] = [];
    }
    return customLayoutsByTag[layoutKey];
  }

  function setLayoutEntries(layoutKey, entries) {
    customLayoutsByTag[layoutKey] = compactLayout(entries);
  }

  function getTargetItemsForLayout(layoutKey) {
    var tag = parseLayoutKey(layoutKey);
    if (!tag) return items.slice();
    return items.filter(function (item) {
      return tagIsSelected(tag, item.tags);
    });
  }

  function compactLayout(entries) {
    var result = [];
    var divider;

    entries.forEach(function (entry) {
      if (entry.type === 'divider') {
        divider = {
          type: 'divider',
          id: typeof entry.id === 'string' && entry.id ? entry.id : createDividerId()
        };
        if (result.length > 0 && result[result.length - 1].type === 'divider') {
          result[result.length - 1] = divider;
        } else {
          result.push(divider);
        }
        return;
      }
      result.push(entry);
    });

    return result;
  }

  function syncLayoutWithItems(layoutKey) {
    var itemById = {};
    var seenItemIds = {};
    var missing = [];
    var normalized = [];
    var targetItems = getTargetItemsForLayout(layoutKey);
    var layoutEntries = getLayoutEntries(layoutKey);

    targetItems.forEach(function (item) {
      itemById[item.id] = true;
    });

    layoutEntries.forEach(function (entry) {
      if (entry.type === 'divider') {
        normalized.push(entry);
        return;
      }
      if (itemById[entry.id] && !seenItemIds[entry.id]) {
        normalized.push(entry);
        seenItemIds[entry.id] = true;
      }
    });

    targetItems.forEach(function (item) {
      if (!seenItemIds[item.id]) {
        missing.push({ type: 'item', id: item.id });
      }
    });

    setLayoutEntries(layoutKey, missing.concat(normalized));
    persistCustomLayouts();
  }

  function resetCustomLayout() {
    var layoutKey = getCurrentLayoutKey();
    var targetItems = getTargetItemsForLayout(layoutKey);

    setLayoutEntries(layoutKey, targetItems.map(function (item) {
      return { type: 'item', id: item.id };
    }));
    persistCustomLayouts();
  }

  function moveCustomLayoutEntry(index, offset) {
    var layoutKey = getCurrentLayoutKey();
    var layoutEntries = getLayoutEntries(layoutKey).slice();
    var target = index + offset;
    var temp;
    if (target < 0 || target >= layoutEntries.length) return;
    temp = layoutEntries[index];
    layoutEntries[index] = layoutEntries[target];
    layoutEntries[target] = temp;
    setLayoutEntries(layoutKey, layoutEntries);
    persistCustomLayouts();
    renderCustomSortList();
    renderCards();
  }

  function addDividerToLayout() {
    var layoutKey = getCurrentLayoutKey();
    var targetItems = getTargetItemsForLayout(layoutKey);
    var layoutEntries = getLayoutEntries(layoutKey).slice();
    var insertIndex = layoutEntries.length;
    var lastItemIndex = -1;
    var i = 0;

    if (targetItems.length < 1) {
      showToast('카드가 있어야 구분선을 추가할 수 있습니다');
      return;
    }

    // 기본은 마지막 카드 앞에 넣어 마지막 카드를 단독 배치하기 쉽게 만든다.
    for (i = layoutEntries.length - 1; i >= 0; i -= 1) {
      if (layoutEntries[i].type === 'item') {
        lastItemIndex = i;
        break;
      }
    }
    if (lastItemIndex !== -1) insertIndex = lastItemIndex;

    layoutEntries.splice(insertIndex, 0, { type: 'divider', id: createDividerId() });
    setLayoutEntries(layoutKey, layoutEntries);
    persistCustomLayouts();
    renderCustomSortList();
    renderCards();
  }

  function removeDividerFromLayout(index) {
    var layoutKey = getCurrentLayoutKey();
    var layoutEntries = getLayoutEntries(layoutKey).slice();

    if (!layoutEntries[index] || layoutEntries[index].type !== 'divider') return;
    layoutEntries.splice(index, 1);
    setLayoutEntries(layoutKey, layoutEntries);
    persistCustomLayouts();
    renderCustomSortList();
    renderCards();
  }

  function getCurrentSortScopeLabel() {
    if (!activeTagFilter) return '전체보기';
    return activeTagFilter.category + ' / ' + activeTagFilter.name;
  }

  function renderCustomSortList() {
    var layoutKey = getCurrentLayoutKey();
    var layoutEntries = getLayoutEntries(layoutKey);
    var itemMap = {};

    customSortListEl.innerHTML = '';

      downBtn.type = 'button';

      downBtn.addEventListener('click', function () {
        moveCustomLayoutEntry(index, 1);

      actions.appendChild(upBtn);
      actions.appendChild(downBtn);

      if (entry.type === 'divider') {
        var removeBtn = document.createElement('button');

      customSortListEl.appendChild(row);

  function normalizeTag(tag) {
    if (!tag || typeof tag !== 'object') return null;
    var category = typeof tag.category === 'string' ? tag.category.trim() : '';
    var name = typeof tag.name === 'string' ? tag.name.trim() : '';
    if (!category || !name) return null;

  }

  function loadSavedTags() {

  function normalizeVariable(variable) {
    var name = '';
    var type = '';
    if (typeof variable === 'string') {
      name = variable.trim();
    } else if (variable && typeof variable === 'object' && typeof variable.name === 'string') {
      name = variable.name.trim();
      if (getVariableType(variable.type)) {
        type = variable.type;
      } else if (getVariableType(variable.prefixId)) {
        type = variable.prefixId;
      }
    }
    if (!name) return null;
    if (!type) type = inferVariableType(name);
    return { name: name, type: type };
  }

  function getLocalStorageSnapshot() {
    var snapshot = {};

    for (var index = 0; index < localStorage.length; index += 1) {
      var key = localStorage.key(index);
      if (key !== null) snapshot[key] = localStorage.getItem(key);
    }

    return snapshot;
  }

  function downloadBlob(blob, fileName) {
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
  }

  function exportLocalStorage() {
    if (!window.JSZip) {
      showToast('ZIP 기능을 불러오지 못했습니다');
      return;
    }

    var zip = new window.JSZip();
    zip.file('localStorage.json', JSON.stringify({
      format: 'message-gen-local-storage',
      version: 1,
      exportedAt: new Date().toISOString(),
      entries: getLocalStorageSnapshot()
    }, null, 2));

    zip.generateAsync({ type: 'blob', compression: 'DEFLATE' })
      .then(function (blob) {
        var date = new Date().toISOString().slice(0, 10);
        downloadBlob(blob, 'text-generator-backup-' + date + '.zip');
        showToast('ZIP으로 내보냈습니다');
      })
      .catch(function () {
        showToast('ZIP 내보내기에 실패했습니다');
      });
  }

  function importLocalStorage(file) {
    if (!file || !window.JSZip) {
      if (!window.JSZip) showToast('ZIP 기능을 불러오지 못했습니다');
      return;
    }

    window.JSZip.loadAsync(file)
      .then(function (zip) {
        var storageFile = zip.file('localStorage.json');
        if (!storageFile) throw new Error('missing storage file');
        return storageFile.async('string');
      })
      .then(function (content) {
        var backup = JSON.parse(content);
        if (!backup || backup.format !== 'message-gen-local-storage' || backup.version !== 1 || !backup.entries || typeof backup.entries !== 'object' || Array.isArray(backup.entries)) {
          throw new Error('invalid backup');
        }

        if (!window.confirm('현재 저장된 내용을 ZIP 백업으로 바꾸고 새로고침하시겠습니까?')) return;

        localStorage.clear();
        Object.keys(backup.entries).forEach(function (key) {
          if (typeof backup.entries[key] === 'string') localStorage.setItem(key, backup.entries[key]);
        });
        window.location.reload();
      })
      .catch(function () {
        showToast('올바른 ZIP 백업 파일이 아닙니다');
      });
  }

  function loadVariableTypes() {
    try {
      var raw = localStorage.getItem(VARIABLE_TYPE_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.map(normalizeVariableType).filter(Boolean) : [];
    } catch (e) {
      return [];
    }

  function persistVariableTypes() {
    try {
      localStorage.setItem(VARIABLE_TYPE_STORAGE_KEY, JSON.stringify(VARIABLE_TYPES));
    } catch (e) {
      showToast('변수 종류 저장에 실패했습니다');
    }
  }

  function normalizeVariableType(type) {
    if (!type || typeof type !== 'object') return null;
    var label = typeof type.label === 'string' ? type.label.trim() : '';
    var baseName = typeof type.baseName === 'string' && type.baseName.trim() ? type.baseName.trim() : label.replace(/\s*변수$/, '').trim();

    if (!label || !baseName) return null;
    if (label.indexOf('변수') === -1) label += ' 변수';

    return {
      id: typeof type.id === 'string' && type.id ? type.id : createVariableTypeId(baseName),
      label: label,
      baseName: baseName
    };
  }

  function loadVariablePrefixes() {
    var prefixes = [];

    try {
      var raw = localStorage.getItem(VARIABLE_PREFIX_STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      prefixes = Array.isArray(parsed) ? parsed.map(normalizeVariablePrefix).filter(Boolean) : [];
    } catch (e) {
      prefixes = [];
    }

    return prefixes;
  }

  function persistVariablePrefixes() {
    try {
      localStorage.setItem(VARIABLE_PREFIX_STORAGE_KEY, JSON.stringify(VARIABLE_PREFIXES));
    } catch (e) {
      showToast('변수 프리픽스 저장에 실패했습니다');
    }
  }

  function normalizeVariablePrefix(prefix) {
    if (!prefix || typeof prefix !== 'object') return null;
    var label = typeof prefix.label === 'string' ? prefix.label.trim() : '';
    var type = getVariableType(prefix.type) ? prefix.type : getVariableType(prefix.typeId) ? prefix.typeId : '';

    if (!label || !type) return null;

    return {
      id: typeof prefix.id === 'string' && prefix.id ? prefix.id : createVariablePrefixId(label),
      label: label,
      type: type
    };
  }

  /* ---------- 클립보드 ---------- */

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length); // iOS Safari 대응
    var ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  /* ---------- UI ---------- */

  function parseTags(value) {
    return value.split(',').map(function (part) {
      part = part.trim();
      if (!part) return null;
      var pieces = part.split(':');
      if (pieces.length < 2) return null;
      return normalizeTag({
        category: pieces.shift(),
        name: pieces.join(':')
      });
    }).filter(Boolean);
  }

  function extractVariablesFromText(text) {
    var variables = [];
    var pattern = /\[([^\[\]\n]+)\]/g;
    var match;

    while ((match = pattern.exec(text)) !== null) {
      var name = match[1].trim();
      if (name && !findVariableByName(variables, name)) {
        variables.push({ name: name, type: inferVariableType(name) });
      }
    }

    return variables.map(normalizeVariable).filter(Boolean);
  }

  function findVariableByName(variables, name) {
    for (var index = 0; index < variables.length; index += 1) {
      if (variables[index].name === name) return variables[index];
    }
    return null;
  }

  function getVariableType(typeId) {
    for (var index = 0; index < VARIABLE_TYPES.length; index += 1) {
      if (VARIABLE_TYPES[index].id === typeId) return VARIABLE_TYPES[index];
    }
    return null;
  }

  function inferVariableType(name) {
    for (var index = 0; index < VARIABLE_TYPES.length; index += 1) {
      var type = VARIABLE_TYPES[index];
      if (name === type.baseName || name.indexOf(type.baseName + ' ') === 0) {
        return type.id;
      }
    }
    return '';
  }

  function escapeRegExp(value) {
    return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function createVariablePrefixId(label) {
    return 'prefix-' + label.replace(/\s+/g, '-').toLowerCase() + '-' + Date.now().toString(36);
  }

  function createVariableTypeId(label) {
    return 'type-' + label.replace(/\s+/g, '-').toLowerCase() + '-' + Date.now().toString(36);
  }

  function findVariableTypeByBaseName(baseName) {
    for (var index = 0; index < VARIABLE_TYPES.length; index += 1) {
      if (VARIABLE_TYPES[index].baseName === baseName) return VARIABLE_TYPES[index];
    }
    return null;
  }

  function findVariablePrefixByLabel(type, label) {
    for (var index = 0; index < VARIABLE_PREFIXES.length; index += 1) {
      if (VARIABLE_PREFIXES[index].type === type && VARIABLE_PREFIXES[index].label === label) return VARIABLE_PREFIXES[index];
    }
    return null;
  }

  function getNextVariableName(text, typeId) {
    var type = getVariableType(typeId);
    if (!type) return '';
    var nextNumber = 1;
    extractVariablesFromText(text).forEach(function (variable) {
      if (variable.type !== type.id) return;
      var match = new RegExp('^' + escapeRegExp(type.baseName) + '\\s+(\\d+)$').exec(variable.name);
      if (match) {
        nextNumber = Math.max(nextNumber, parseInt(match[1], 10) + 1);
      }
    });
    return type.baseName + ' ' + nextNumber;
  }

  function insertTextAtCursor(textarea, text) {
    var start = typeof textarea.selectionStart === 'number' ? textarea.selectionStart : textarea.value.length;
    var end = typeof textarea.selectionEnd === 'number' ? textarea.selectionEnd : textarea.value.length;

    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    textarea.focus();
    textarea.setSelectionRange(start + text.length, start + text.length);
  }

  function formatTag(tag) {
    return tag.name;
  }

  function findSavedTag(tag) {
    for (var index = 0; index < SAVED_TAGS.length; index += 1) {
      if (SAVED_TAGS[index].category === tag.category && SAVED_TAGS[index].name === tag.name) return SAVED_TAGS[index];
    }
    return null;
  }

  function getOrderedTags(tags) {
    return tags.slice().sort(function (firstTag, secondTag) {
      var firstIndex = SAVED_TAGS.indexOf(findSavedTag(firstTag));
      var secondIndex = SAVED_TAGS.indexOf(findSavedTag(secondTag));
      if (firstIndex === -1) firstIndex = SAVED_TAGS.length;
      if (secondIndex === -1) secondIndex = SAVED_TAGS.length;
      return firstIndex - secondIndex;
    });
  }

  function saveTags(tags) {
    var hasNewTag = false;
    tags.forEach(function (tag) {
      if (findSavedTag(tag)) return;
      SAVED_TAGS.push(tag);
      hasNewTag = true;
    });
    if (hasNewTag) persistSavedTags();
  }

  function setCardTags(tags) {
    newTagsEl.value = getOrderedTags(tags).map(function (tag) {
      return tag.category + ':' + tag.name;
    }).join(', ');
  }

  function tagIsSelected(tag, tags) {
    return tags.some(function (item) {
      return item.category === tag.category && item.name === tag.name;
    });
  }

  function getTagCategories() {
    var categories = [];
    SAVED_TAGS.forEach(function (tag) {
      if (categories.indexOf(tag.category) === -1) categories.push(tag.category);
    });
    return categories;
  }

  function getKstWeekdayTag() {
    var weekday = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul',
      weekday: 'long'
    }).format(new Date());
    for (var index = 0; index < SAVED_TAGS.length; index += 1) {

    }
    return null;

  function getTagFilterPulseKey(tag) {
    if (!tag) return 'all';
    return 'tag:' + tag.category + ':' + tag.name;
  }

  function applyTagFilterPulse(button, pulseKey, currentPulseKey) {
    if (pulseKey !== currentPulseKey) return;
    button.classList.add('filter-pulse');
    button.addEventListener('animationend', function () {
      button.classList.remove('filter-pulse');
    }, { once: true });
  }

  function renderTagFilter() {
    var categories = getTagCategories();
    var currentPulseKey = pendingTagFilterPulseKey;
    tagFilterCategoriesEl.innerHTML = '';
    tagFilterListEl.innerHTML = '';

    if (activeTagFilter && !findSavedTag(activeTagFilter)) {
      activeTagFilter = null;
    }

    mobileTagFilterBtn.textContent = activeTagFilter ? formatTag(activeTagFilter) : '전체보기';

    if (categories.indexOf(activeTagFilterCategory) === -1) {
      activeTagFilterCategory = categories[0] || null;
      activeTagFilter = null;
    }

    categories.forEach(function (category) {
      var categoryBtn = document.createElement('button');
      var isActive = category === activeTagFilterCategory;
      categoryBtn.className = 'tag-filter-category';
      categoryBtn.type = 'button';
      categoryBtn.setAttribute('role', 'tab');
      categoryBtn.textContent = category;
      categoryBtn.classList.toggle('active', isActive);
      categoryBtn.setAttribute('aria-selected', isActive ? 'true' : 'false');
      applyTagFilterPulse(categoryBtn, 'category:' + category, currentPulseKey);
      categoryBtn.addEventListener('click', function () {
        pendingTagFilterPulseKey = 'category:' + category;
        activeTagFilterCategory = category;
        activeTagFilter = null;
        renderTagFilter();
        renderCards();
      });
      tagFilterCategoriesEl.appendChild(categoryBtn);
    });

    if (!activeTagFilterCategory) {
      var empty = document.createElement('div');
      empty.className = 'tag-filter-empty';
      empty.textContent = '등록된 태그가 없습니다.';
      tagFilterListEl.appendChild(empty);
      return;
    }

    var allChip = document.createElement('button');
    var isShowingAll = !activeTagFilter;
    allChip.className = 'tag-filter-chip tag-filter-all-chip';
    allChip.type = 'button';
    allChip.textContent = '전체보기';
    allChip.classList.toggle('selected', isShowingAll);
    allChip.setAttribute('aria-pressed', isShowingAll ? 'true' : 'false');
    applyTagFilterPulse(allChip, getTagFilterPulseKey(null), currentPulseKey);
    allChip.addEventListener('click', function () {
      pendingTagFilterPulseKey = getTagFilterPulseKey(null);
      activeTagFilter = null;
      renderTagFilter();
      renderCards();
      closeMobileTagDrawer();
    });
    tagFilterListEl.appendChild(allChip);

    SAVED_TAGS.filter(function (tag) {
      return tag.category === activeTagFilterCategory;
    }).forEach(function (tag) {
      var chip = document.createElement('button');
      var isSelected = activeTagFilter && tagIsSelected(tag, [activeTagFilter]);
      chip.className = 'tag-filter-chip';
      chip.type = 'button';
      chip.textContent = formatTag(tag);
      chip.classList.toggle('selected', isSelected);
      chip.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
      applyTagFilterPulse(chip, getTagFilterPulseKey(tag), currentPulseKey);
      chip.addEventListener('click', function () {
        activeTagFilter = isSelected ? null : tag;
        pendingTagFilterPulseKey = getTagFilterPulseKey(activeTagFilter);
        renderTagFilter();
        renderCards();
        closeMobileTagDrawer();
      });
      tagFilterListEl.appendChild(chip);
    });
    pendingTagFilterPulseKey = null;
  }

  function renderCardTagControls() {
    var selectedTags = getOrderedTags(parseTags(newTagsEl.value));
    selectedTagListEl.innerHTML = '';
    tagCategoryListEl.innerHTML = '';
    tagOptionListEl.innerHTML = '';

    selectedTags.forEach(function (tag) {

      chip.setAttribute('aria-label', formatTag(tag) + ' 태그 제거');
      chip.addEventListener('click', function () {
        setCardTags(selectedTags.filter(function (item) {
          return item.category !== tag.category || item.name !== tag.name;
        }));
        renderCardTagControls();
      });
      selectedTagListEl.appendChild(chip);
    });

    var categories = [];
    SAVED_TAGS.forEach(function (tag) {

        renderCardTagControls();
      });
      tagCategoryListEl.appendChild(categoryBtn);

    SAVED_TAGS.filter(function (tag) {
      return tag.category === activeTagCategory;

        if (isSelected) {
          setCardTags(selectedTags.filter(function (item) {
            return item.category !== tag.category || item.name !== tag.name;

  function moveSavedTag(tag, direction) {
    var categoryIndexes = [];
    SAVED_TAGS.forEach(function (savedTag, index) {
      if (savedTag.category === tag.category) categoryIndexes.push(index);
    });

    var currentCategoryIndex = -1;
    categoryIndexes.forEach(function (savedIndex, index) {
      var savedTag = SAVED_TAGS[savedIndex];
      if (savedTag.category === tag.category && savedTag.name === tag.name) currentCategoryIndex = index;
    });

    var targetCategoryIndex = currentCategoryIndex + direction;
    if (currentCategoryIndex === -1 || targetCategoryIndex < 0 || targetCategoryIndex >= categoryIndexes.length) return;

    var currentIndex = categoryIndexes[currentCategoryIndex];
    var targetIndex = categoryIndexes[targetCategoryIndex];
    var movedTag = SAVED_TAGS[currentIndex];
    SAVED_TAGS[currentIndex] = SAVED_TAGS[targetIndex];
    SAVED_TAGS[targetIndex] = movedTag;
    persistSavedTags();
    renderTagManageList();
    renderCardTagControls();
    renderTagFilter();
    renderCards();
  }

  function renderVariableContextHint(container, text, variableName) {
    var token = '[' + variableName + ']';
    var index = text.indexOf(token);
    var beforeStart = 0;
    var afterEnd = 0;
    var contextText = '';
    var pattern = /\[([^\[\]\n]+)\]/g;
    var lastIndex = 0;
    var match;
    var BEFORE_LENGTH = 80;
    var AFTER_LENGTH = 120;

    container.innerHTML = '';

    if (index === -1) {
      container.textContent = '예시 문맥을 찾지 못했습니다. 문맥에 맞는 값을 입력해 주세요.';
      return;
    }

    beforeStart = Math.max(0, index - BEFORE_LENGTH);
    afterEnd = Math.min(text.length, index + token.length + AFTER_LENGTH);
    contextText = text.slice(beforeStart, afterEnd);

    if (beforeStart > 0) contextText = '…' + contextText;
    if (afterEnd < text.length) contextText += '…';

    while ((match = pattern.exec(contextText)) !== null) {
      container.appendChild(document.createTextNode(contextText.slice(lastIndex, match.index)));

      var chip = document.createElement('span');
      var isTargetChip = beforeStart + match.index - (beforeStart > 0 ? 1 : 0) === index;
      chip.className = 'variable-context-chip';
      chip.dataset.contextTarget = isTargetChip ? 'true' : 'false';
      chip.classList.toggle('active', isTargetChip);
      chip.textContent = match[0];
      container.appendChild(chip);

      lastIndex = pattern.lastIndex;
    }

    container.appendChild(document.createTextNode(contextText.slice(lastIndex)));
  }

  function renderPreviewWithChips(preview, text) {
    var pattern = /\[([^\[\]\n]+)\]/g;
    var lastIndex = 0;
    var match;

    while ((match = pattern.exec(text)) !== null) {
      preview.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));

      var variableButton = document.createElement('button');
      variableButton.className = 'preview-variable';
      variableButton.type = 'button';
      variableButton.textContent = match[1].trim();
      variableButton.setAttribute('aria-label', match[1].trim() + ' 변수');
      preview.appendChild(variableButton);

      lastIndex = pattern.lastIndex;
    }

    preview.appendChild(document.createTextNode(text.slice(lastIndex)));
  }

  function replaceAllText(text, search, replacement) {
    return text.split(search).join(replacement);
  }

  function fillTemplate(text, values) {
    var result = text;
    Object.keys(values).forEach(function (name) {
      result = replaceAllText(result, '[' + name + ']', values[name]);
    });
    return result;
  }

  function formatAmountValue(rawValue) {
    var isNegative = /^\s*-/.test(rawValue || '');
    var digits = (rawValue || '').replace(/[^\d]/g, '');
    if (!digits) return rawValue;
    return (isNegative ? '-' : '') + Number(digits).toLocaleString('ko-KR') + '원';
  }

  function parseTimeText(value) {
    var match = /^\s*(\d{1,2}):(\d{2})\s*$/.exec(value || '');
    var hour = 0;
    var minute = 0;
    if (!match) return null;
    hour = parseInt(match[1], 10);
    minute = parseInt(match[2], 10);
    if (hour < 0 || hour > 23 || minute < 0 || minute > 59) return null;
    return { hour: hour, minute: minute };
  }

  function formatTimeText(hour, minute) {
    var normalizedHour = ((hour % 24) + 24) % 24;
    var normalizedMinute = ((minute % 60) + 60) % 60;
    var hourText = normalizedHour < 10 ? '0' + normalizedHour : '' + normalizedHour;
    var minuteText = normalizedMinute < 10 ? '0' + normalizedMinute : '' + normalizedMinute;
    return hourText + ':' + minuteText;
  }

  function subtractMinutesFromTime(timeValue, minutesToSubtract) {
    var total = (timeValue.hour * 60) + timeValue.minute - minutesToSubtract;
    var minutesPerDay = 24 * 60;
    var normalized = ((total % minutesPerDay) + minutesPerDay) % minutesPerDay;
    var hour = Math.floor(normalized / 60);
    var minute = normalized % 60;
    return formatTimeText(hour, minute);
  }

  function applyTimeAutoFillFromSecondInput(sourceInput) {
    var sourceName = sourceInput && sourceInput.dataset ? sourceInput.dataset.variableName : '';
    var sourceType = sourceInput && sourceInput.dataset ? sourceInput.dataset.variableType : '';
    var typeInfo = getVariableType(sourceType);
    var sourceTime = parseTimeText(sourceInput ? sourceInput.value : '');
    var nameMatch = /^(.*?)(\d+)\s*$/.exec(sourceName || '');
    var sourceIndex = 0;
    var relatedInputs = variableFieldsEl.querySelectorAll('input[data-variable-name^="' + nameMatch[1] + '"]');
    var relatedByNumber = {};
    var hasThird = false;
    var targetInput = null;

    if (!typeInfo || typeInfo.baseName !== '시간' || !sourceTime || !nameMatch) return;
    sourceIndex = parseInt(nameMatch[2], 10);

    Array.prototype.forEach.call(relatedInputs, function (input) {
      var inputMatch = /^(.*?)(\d+)\s*$/.exec(input.dataset.variableName || '');
      if (!inputMatch || inputMatch[1] !== nameMatch[1]) return;
      relatedByNumber[parseInt(inputMatch[2], 10)] = input;
    });

    hasThird = !!relatedByNumber[3];

    if (sourceIndex === 3 && hasThird) {
      targetInput = relatedByNumber[2];
      if (targetInput && !targetInput.value.trim()) {
        targetInput.value = subtractMinutesFromTime(sourceTime, 20);
      }

      targetInput = relatedByNumber[1];
      if (targetInput && !targetInput.value.trim()) {
        targetInput.value = subtractMinutesFromTime(sourceTime, 40);
      }
      return;
    }

    if (sourceIndex !== 2 || hasThird) return;

    targetInput = variableFieldsEl.querySelector('input[data-variable-name="' + nameMatch[1] + '1"]');
    if (!targetInput || targetInput.value.trim()) return;

    targetInput.value = subtractMinutesFromTime(sourceTime, 30);
  }

  function applyAllTimeAutoFill() {
    Array.prototype.forEach.call(variableFieldsEl.querySelectorAll('input'), function (input) {
      applyTimeAutoFillFromSecondInput(input);
    });
  }

  /* ---------- 스와이프 ---------- */

  function closeSwipeCard(wrapper) {
    if (!wrapper) return;
    var card = wrapper.querySelector('.card');
    card.style.transition = 'transform 0.2s ease-out';
    card.style.transform = 'translateX(0)';
    wrapper.classList.remove('open');
    if (openSwipeWrapper === wrapper) openSwipeWrapper = null;
  }

  function swipeMoved(wrapper) {
    return wrapper.dataset.moved === 'true';
  }

  function getTranslateX(el) {
    var transform = window.getComputedStyle(el).transform;
    if (!transform || transform === 'none') return 0;
    var match = /matrix\(([^)]+)\)/.exec(transform);
    if (!match) return 0;
    return parseFloat(match[1].split(',')[4]) || 0;
  }

  function attachSwipeHandlers(wrapper, card) {
    var startX = 0;
    var startY = 0;
    var baseX = 0;
    var dragging = false;

    card.addEventListener('pointerdown', function (e) {
      if (openSwipeWrapper && openSwipeWrapper !== wrapper) closeSwipeCard(openSwipeWrapper);
      startX = e.clientX;
      startY = e.clientY;
      baseX = wrapper.classList.contains('open') ? -SWIPE_ACTIONS_WIDTH : 0;
      dragging = true;
      wrapper.dataset.moved = 'false';
      card.style.transition = 'none';
    });

    card.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var deltaX = e.clientX - startX;
      var deltaY = e.clientY - startY;

      if (wrapper.dataset.moved !== 'true' && Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 8) {
        dragging = false;
        return;
      }
      if (Math.abs(deltaX) > 6) wrapper.dataset.moved = 'true';

      var next = Math.min(0, Math.max(-SWIPE_ACTIONS_WIDTH, baseX + deltaX));
      card.style.transform = 'translateX(' + next + 'px)';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      var current = getTranslateX(card);
      var shouldOpen = current < -SWIPE_ACTIONS_WIDTH / 2;
      card.style.transition = 'transform 0.2s ease-out';
      card.style.transform = 'translateX(' + (shouldOpen ? -SWIPE_ACTIONS_WIDTH : 0) + 'px)';
      wrapper.classList.toggle('open', shouldOpen);
      openSwipeWrapper = shouldOpen ? wrapper : (openSwipeWrapper === wrapper ? null : openSwipeWrapper);
    }

    card.addEventListener('pointerup', endDrag);
    card.addEventListener('pointercancel', endDrag);
  }

  /* ---------- 모달 ---------- */

  function openModal(item) {
    editingItem = item || null;
    modalTitleEl.textContent = editingItem ? '카드 편집' : '새 카드';
    modalOverlay.classList.remove('hidden');
    beginModalSession();
    newTitleEl.value = editingItem ? editingItem.title : '';
    newTextEl.value = editingItem ? editingItem.text : '';
    newTagsEl.value = editingItem ? editingItem.tags.map(function (tag) {
      return tag.category + ':' + tag.name;
    }).join(', ') : '';
    var schedule = editingItem ? editingItem.scheduledMessage : null;
    scheduledMessageEl.value = schedule ? schedule.note : '';
    activeTagCategory = null;
    renderCardTagControls();
    updateSaveState();
    // 사용자 제스처 내에서 focus해야 iOS 키보드가 바로 열림
    newTitleEl.focus();
  }

  function closeModal() {
    modalOverlay.classList.add('hidden');
    endModalSession();
    editingItem = null;
  }

  function openVariableModal(item) {
    activeVariableItem = item;
    variableFieldsEl.innerHTML = '';
    variableNavListEl.innerHTML = '';
    variableStepGroups = [];
    currentVariableStep = 0;

    item.variables.forEach(function (variable, index) {
      var group = document.createElement('div');
      group.className = 'variable-field-group';

      var context = document.createElement('div');
      context.className = 'variable-context';
      renderVariableContextHint(context, item.text, variable.name);

      var input = document.createElement('input');
      input.id = 'variableInput' + index;
      input.className = 'field-input variable-input';
      input.type = 'text';
      input.dataset.variableName = variable.name;
      input.dataset.variableType = variable.type;
      input.setAttribute('aria-label', variable.name + ' 값 입력');
      input.placeholder = '문맥에 맞는 값을 입력하세요';

      input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        goToVariableStep(currentVariableStep + 1);
      });

      input.addEventListener('input', function () {
        applyTimeAutoFillFromSecondInput(input);
        renderVariableNavigation();
      });

      group.appendChild(context);
      group.appendChild(input);

      var prefixes = getVariablePrefixesByType(variable.type);
      if (prefixes.length > 0) {
        var prefixSelect = document.createElement('select');
        prefixSelect.className = 'variable-prefix-dropdown';
        prefixSelect.setAttribute('aria-label', variable.name + ' 프리픽스 선택');

        var placeholderOption = document.createElement('option');
        placeholderOption.value = '';
        placeholderOption.textContent = '프리픽스 선택';
        prefixSelect.appendChild(placeholderOption);

        prefixes.forEach(function (prefix) {
          var option = document.createElement('option');
          option.value = prefix.label;
          option.textContent = prefix.label;
          prefixSelect.appendChild(option);
        });

        prefixSelect.addEventListener('change', function () {
          if (!prefixSelect.value) return;
          input.value = prefixSelect.value;
          goToVariableStep(currentVariableStep + 1);
        });

        group.appendChild(prefixSelect);
      }

      variableFieldsEl.appendChild(group);
      variableStepGroups.push(group);
    });

    variableOverlay.classList.remove('hidden');
    beginModalSession();

    goToVariableStep(0);
  }

  function goToVariableStep(index) {
    var total = variableStepGroups.length;
    if (index < 0) index = 0;
    if (index >= total) index = total - 1;

    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }

    currentVariableStep = index;

    variableStepGroups.forEach(function (group, i) {
      group.classList.toggle('hidden', i !== index);
      Array.prototype.forEach.call(group.querySelectorAll('.variable-context-chip'), function (chip) {
        var isTargetChip = chip.dataset.contextTarget === 'true';
        chip.classList.toggle('active', i === index && isTargetChip);
      });
    });

    variableStepIndicatorEl.classList.toggle('hidden', total <= 1);
    variableStepIndicatorEl.textContent = (index + 1) + ' / ' + total;

    prevVariableBtn.classList.toggle('hidden', index === 0);
    generateBtn.textContent = index === total - 1 ? '생성' : '다음';

    renderVariableNavigation();
  }

  function closeVariableModal() {
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
    variableOverlay.classList.add('hidden');
    endModalSession();
    activeVariableItem = null;
    variableStepGroups = [];
    currentVariableStep = 0;
  }

  function openVariableManageModal() {
    renderVariableTypeSelect();
    variablePrefixLabelEl.value = '';
    activeVariableManageType = null;
    renderVariableManageList();
    variableManageOverlay.classList.remove('hidden');
    beginModalSession();
  }

  function closeVariableManageModal() {
    variableManageOverlay.classList.add('hidden');
    endModalSession();
  }

  function openTagManageModal() {
    renderTagCategorySelect();
    tagLabelEl.value = '';
    activeTagManageCategory = null;
    renderTagManageList();
    tagManageOverlay.classList.remove('hidden');
    beginModalSession();
    tagLabelEl.focus();
  }

  function closeTagManageModal() {
    tagManageOverlay.classList.add('hidden');
    endModalSession();
  }

  /* ---------- 이벤트 ---------- */

  newCardBtn.addEventListener('click', function () { openModal(); });

  document.addEventListener('click', function (e) {
    if (openSwipeWrapper && !openSwipeWrapper.contains(e.target)) {
      closeSwipeCard(openSwipeWrapper);
    }
  });
  cancelBtn.addEventListener('click', closeModal);
  cancelVariableBtn.addEventListener('click', closeVariableModal);
  prevVariableBtn.addEventListener('click', function () { goToVariableStep(currentVariableStep - 1); });
  closeVariableManageBtn.addEventListener('click', closeVariableManageModal);
  closeTagManageBtn.addEventListener('click', closeTagManageModal);

  tagManageBtn.addEventListener('click', openSettingsDrawer);
  mobileTagFilterBtn.addEventListener('click', openMobileTagDrawer);
  mobileTagDrawerCloseBtn.addEventListener('click', closeMobileTagDrawer);
  settingsDrawerCloseBtn.addEventListener('click', closeSettingsDrawer);
  settingsOpenCustomSortBtn.addEventListener('click', openCustomSortSection);
  customSortBackBtn.addEventListener('click', showMainSettingsMenu);
  settingsOpenVariableManageBtn.addEventListener('click', function () {
    closeSettingsDrawer();
    openVariableManageModal();
  });
  settingsOpenTagManageBtn.addEventListener('click', function () {
    closeSettingsDrawer();
    openTagManageModal();
  });
  settingsExportBtn.addEventListener('click', exportLocalStorage);
  settingsImportBtn.addEventListener('click', function () {
    settingsImportInput.value = '';
    settingsImportInput.click();
  });
  settingsImportInput.addEventListener('change', function () {
    importLocalStorage(settingsImportInput.files[0]);
  });
  addDividerBtn.addEventListener('click', addDividerToLayout);
  resetLayoutBtn.addEventListener('click', function () {
    resetCustomLayout();
    renderCustomSortList();
    renderCards();
    showToast('정렬을 초기화했습니다');
  });
  variableTypeSelectEl.addEventListener('change', updateVariableTypeNewInputVisibility);

  function updateSaveState() {
    saveBtn.disabled = newTitleEl.value.trim().length === 0 || newTextEl.value.trim().length === 0;
  }

  newTitleEl.addEventListener('input', updateSaveState);
  newTextEl.addEventListener('input', updateSaveState);
  scheduledMessageEl.addEventListener('input', updateSaveState);

  appTitleEl.addEventListener('click', function () {
    appTitleEl.classList.remove('title-press');
    void appTitleEl.offsetWidth;
    appTitleEl.classList.add('title-press');

    var reloadDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220;
    window.setTimeout(function () {
      window.location.reload();
    }, reloadDelay);
  });

  addVariablePrefixBtn.addEventListener('click', function () {
    var creatingNewType = variableTypeSelectEl.value === NEW_VARIABLE_TYPE_VALUE;
    var prefixLabel = variablePrefixLabelEl.value.trim();

    if (!creatingNewType && !prefixLabel) {
      showToast('프리픽스를 입력해 주세요');
      return;
    }

    var typeId = variableTypeSelectEl.value;

    if (creatingNewType) {
      var baseName = variableTypeNewInputEl.value.trim();
      if (!baseName || findVariableTypeByBaseName(baseName)) {
        showToast('종류를 확인해 주세요');
        return;
      }
      var newType = normalizeVariableType({
        id: createVariableTypeId(baseName),
        label: baseName + ' 변수',
        baseName: baseName
      });
      VARIABLE_TYPES.push(newType);
      persistVariableTypes();
      typeId = newType.id;
    }

    if (prefixLabel) {
      if (findVariablePrefixByLabel(typeId, prefixLabel)) {
        showToast('이미 등록된 프리픽스입니다');
      } else {
        VARIABLE_PREFIXES.push(normalizeVariablePrefix({
          id: createVariablePrefixId(prefixLabel),
          label: prefixLabel,
          type: typeId
        }));
        persistVariablePrefixes();
      }
    }

    renderVariablePrefixButtons();
    renderVariableTypeSelect();
    variableTypeSelectEl.value = typeId;
    updateVariableTypeNewInputVisibility();
    activeVariableManageType = typeId;
    renderVariableManageList();
    renderCards();
    variablePrefixLabelEl.value = '';
    showToast('추가되었습니다');
  });

  function getSavedTagCategories() {
    var categories = [];
    SAVED_TAGS.forEach(function (tag) {
      if (categories.indexOf(tag.category) === -1) categories.push(tag.category);
    });
    return categories;
  }

  function renderTagCategorySelect() {
    var previousValue = tagCategorySelectEl.value;
    var categories = getSavedTagCategories();
    tagCategorySelectEl.innerHTML = '';

    categories.forEach(function (category) {
      var option = document.createElement('option');
      option.value = category;
      option.textContent = category;
      tagCategorySelectEl.appendChild(option);
    });

    var newOption = document.createElement('option');
    newOption.value = NEW_TAG_CATEGORY_VALUE;
    newOption.textContent = '직접 입력 (새 분류)';
    tagCategorySelectEl.appendChild(newOption);

    tagCategorySelectEl.value = categories.indexOf(previousValue) !== -1 ? previousValue : (categories[0] || NEW_TAG_CATEGORY_VALUE);
    updateTagCategoryNewInputVisibility();
  }

  function updateTagCategoryNewInputVisibility() {
    var showNewInput = tagCategorySelectEl.value === NEW_TAG_CATEGORY_VALUE;
    tagCategoryNewInputEl.classList.toggle('hidden', !showNewInput);
    if (!showNewInput) tagCategoryNewInputEl.value = '';
  }

  tagCategorySelectEl.addEventListener('change', updateTagCategoryNewInputVisibility);

  addTagBtn.addEventListener('click', function () {
    var category = tagCategorySelectEl.value === NEW_TAG_CATEGORY_VALUE
      ? tagCategoryNewInputEl.value
      : tagCategorySelectEl.value;
    var tag = normalizeTag({
      category: category,
      name: tagLabelEl.value
    });
    if (!tag || findSavedTag(tag)) {
      showToast('태그를 확인해 주세요');
      return;
    }

    SAVED_TAGS.push(tag);
    persistSavedTags();
    renderCardTagControls();
    renderTagFilter();
    renderTagCategorySelect();
    tagCategorySelectEl.value = tag.category;
    updateTagCategoryNewInputVisibility();
    activeTagManageCategory = tag.category;
    renderTagManageList();
    tagLabelEl.value = '';
    showToast('태그가 추가되었습니다');
  });

  saveBtn.addEventListener('click', function () {
    var title = newTitleEl.value.trim();
    var text = newTextEl.value.trim();
    if (!title || !text) return;
    var scheduleNote = scheduledMessageEl.value.trim();
    var scheduledMessage = scheduleNote ? { note: scheduleNote } : null;

    var wasEditing = !!editingItem;

    if (editingItem) {
      editingItem.title = title;
      editingItem.text = text;
      editingItem.tags = parseTags(newTagsEl.value);
      editingItem.variables = extractVariablesFromText(text);
      editingItem.scheduledMessage = scheduledMessage;
    } else {
      var newItem = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: title,
        text: text,
        tags: parseTags(newTagsEl.value),
        variables: extractVariablesFromText(text),
        scheduledMessage: scheduledMessage,
        createdAt: Date.now()
      };
      items.unshift(newItem);
    }
    saveTags(editingItem ? editingItem.tags : items[0].tags);
    persistItems();
    syncLayoutWithItems(getCurrentLayoutKey());
    renderTagFilter();
    renderCards();
    renderCustomSortList();

    closeModal();
    showToast(wasEditing ? '수정되었습니다' : '저장되었습니다');
  });

  generateBtn.addEventListener('click', function () {
    if (!activeVariableItem) return;

    if (currentVariableStep < variableStepGroups.length - 1) {
      goToVariableStep(currentVariableStep + 1);
      return;
    }

    applyAllTimeAutoFill();

    var values = {};
    Array.prototype.forEach.call(variableFieldsEl.querySelectorAll('input'), function (input) {
      var value = input.value.trim();
      var type = getVariableType(input.dataset.variableType);
      if (type && type.baseName === '금액' && value) value = formatAmountValue(value);
      values[input.dataset.variableName] = value;
    });

    showOutput(fillTemplate(activeVariableItem.text, values));
    closeVariableModal();
  });

  /* ---------- 초기화 ---------- */

  renderVariablePrefixButtons();
  renderCardTagControls();
  syncLayoutWithItems(getCurrentLayoutKey());
  activeTagFilter = getKstWeekdayTag();
  activeTagFilterCategory = activeTagFilter ? activeTagFilter.category : null;
  renderTagFilter();
  renderCards();
})();
</script>
</body>
</html>
